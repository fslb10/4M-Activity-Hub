unrelated events.</div>`:`<div class="sequence-flow">${order.map((_,i)=>`<span class="sequence-slot">Moment ${i+1}</span>${i<3?'<span class="sequence-arrow">→</span>':''}`).join('')}</div><div class="reveal-placeholder"><span class="lock-symbol">◇</span><span>The correct sequence is concealed. Ask students to suggest the order before revealing it.</span></div>`}<div class="block-bottom"><button type="button" class="btn btn-${revealed?'light':'gold'}" data-reveal="model">${revealed?'Conceal sequence':'Reveal correct sequence'}</button><button type="button" class="btn btn-teal" data-go="1">Begin Case 01 →</button></div></section></div></div><p class="keyboard-hint">Presentation shortcuts: ← / → change stages · R reveals next answer · H conceals current stage · + / − change text size · F fullscreen.</p>`}

function synthesis(){const r=reveal[6],summaries=[['The Cry','Real suffering and trust in God'],['The Mockery','A Messiah whose power is self-giving love'],['The Wounds','Textual care and Christ-centred interpretation'],['The Turn','Suffering does not have the final word'],['All Nations','The message of salvation is for the world']];return `<div class="synthesis-head"><div><div class="kicker">Unit 1.5 · Psalm 22 · class take-up sheet</div><h1>Bring the evidence together.</h1><p>Return to the central question: how do Christians understand Jesus’ Paschal Mystery by reading Psalm 22 alongside the Gospels?</p></div></div><section class="surface summary-card"><div class="kicker">The five connected insights</div><h2>The investigation in one view</h2>${r.model?`<div class="summary-list">${summaries.map((s,i)=>`<div class="summary-step"><div class="num">CASE 0${i+1}</div><strong>${escapeHTML(s[0])}</strong><p>${escapeHTML(s[1])}</p></div>`).join('')}</div>`:`<div class="reveal-placeholder"><span class="lock-symbol">◇</span><span>Ask the class to name one idea learned from each case file before showing this summary.</span></div>`}<div class="block-bottom"><button class="btn ${r.model?'btn-light':'btn-gold'}" data-reveal="model">${r.model?'Conceal five insights':'Reveal five insights'}</button></div></section><section class="big-idea"><div class="kicker">The central theological connection</div><h2>Passion → Death → Resurrection → Ascension</h2>${r.insights?`<p>The Paschal Mystery is the saving work of Jesus Christ. Psalm 22 helps Christians reflect on the reality of His suffering, the deeper meaning of His sacrifice, the hope revealed through His Resurrection, and the worldwide mission that follows. The connections are theological readings of Scripture, grounded in careful attention to each passage’s original wording and context.</p>`:`<p>What does the whole Paschal Mystery tell us about suffering, salvation, hope, and the mission of the Church?</p>`}<div class="block-bottom"><button class="btn ${r.insights?'btn-light':'btn-gold'}" data-reveal="insights">${r.insights?'Conceal synthesis':'Reveal class synthesis'}</button></div></section><div class="discussion-grid"><section class="surface synthesis-question"><div class="kicker">Exit discussion</div><h3>If Jesus had only died, what would be missing?</h3><p>Listen for the significance of the Resurrection: victory over death, the vindication of Christ’s mission, and the foundation of Christian hope.</p></section><section class="surface synthesis-question"><div class="kicker">Beyond Unit 1.5</div><h3>What follows from the Resurrection?</h3><ul><li>The Great Commission (Matthew 28:19–20)</li><li>The Church’s mission to proclaim the Gospel</li><li>The promise of the risen Christ's presence with His followers</li></ul></section></div><p class="keyboard-hint">Print all five answers and facilitation notes with Ctrl+P / ⌘P. This prints the full teacher guide, not merely the current screen.</p>`}

function render(){nav();$('page').innerHTML=stage===0?intro():stage===6?synthesis():caseHTML(stage-1);$('prevBtn').disabled=stage===0;$('nextBtn').disabled=stage===6;$('stageName').textContent=(stage+1)+' / 7 · '+STAGES[stage].short;$('notesBtn').setAttribute('aria-pressed',String(showNotes));$('notesBtn').style.background=showNotes?'#416a66':'';const r=reveal[stage];let left=stage===0?(!r.model?1:0):stage===6?(!r.model?1:0)+(!r.insights?1:0):(!r.quiz?1:0)+(!r.model?1:0)+(!r.insights?1:0);$('revealNextBtn').disabled=left===0;$('revealNextBtn').textContent=left?'Reveal next ↓':'All revealed ✓';$('revealAllBtn').disabled=left===0;$('hideCurrentBtn').disabled=stage===0?!r.model:!(r.quiz||r.model||r.insights);}
function go(i){if(!Number.isInteger(i)||i<0||i>6)return;stage=i;render();window.scrollTo({top:0,behavior:'instant'})}
function revealNext(){const r=reveal[stage],sequence=stage===0?['model']:stage===6?['model','insights']:['quiz','model','insights'];for(const s of sequence){if(!r[s]){r[s]=true;render();return}}notify('Everything on this stage is already revealed.')}
function setReveal(which){const r=reveal[stage];r[which]=!r[which];render();}
function revealAll(){const r=reveal[stage];(stage===0?['model']:stage===6?['model','insights']:['quiz','model','insights']).forEach(s=>r[s]=true);render()}
function conceal(){const r=reveal[stage];r.quiz=false;r.model=false;r.insights=false;render();}
function setSize(delta){typeIndex=Math.min(typeSizes.length-1,Math.max(0,typeIndex+delta));document.documentElement.style.fontSize=typeSizes[typeIndex]+'px';notify('Projected text size: '+typeSizes[typeIndex]+'px')}
function buildPrint(){const root=$('printKey');root.innerHTML=`<h1>Psalm 22 · The Paschal Mystery</h1><p><b>HRE4M1 · Unit 1.5 · Teacher Discussion Guide</b></p><p>Companion to the student investigation: ${STUDENT_URL}. The teacher model answers are examples, not the only acceptable student formulations. Match each student answer to the evidence and reasoning.</p><h2>Opening: Put the Paschal Mystery in order</h2><p><b>Passion → Death → Resurrection → Ascension</b></p>${cases.map(d=>`<section class="print-case"><h2>Case ${d.number}: ${escapeHTML(d.tab)} · ${escapeHTML(d.name)}</h2><p class="print-refs"><b>Scripture:</b> ${d.evidence.map(e=>escapeHTML(e.ref)).join(' · ')}</p><p><b>Original student question:</b> ${escapeHTML(d.question)}</p><p><b>Quick check:</b> ${escapeHTML(d.notice)}<br><b>Correct response ${String.fromCharCode(65+d.correct)}:</b> ${escapeHTML(d.choices[d.correct])}<br>${escapeHTML(d.rationale)}</p><h3>Model answer</h3><p class="print-idea">${escapeHTML(d.model)}</p><h3>Unpack the reasoning</h3><ul class="print-bullet">${d.unpack.map(x=>`<li><b>${escapeHTML(x.heading)}:</b> ${escapeHTML(x.text)}</li>`).join('')}</ul><h3>What to affirm</h3><ul class="print-bullet">${d.affirm.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul><h3>Misconceptions</h3><ul class="print-bullet">${d.avoid.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul><h3>Discussion prompts</h3><ul class="print-bullet">${d.discuss.map(x=>`<li>${escapeHTML(x)}</li>`).join('')}</ul><p class="print-refs"><b>CCC:</b> ${escapeHTML(d.refs.join(', '))}</p>${d.caution?`<p class="print-note">${escapeHTML(d.caution)}</p>`:''}</section>`).join('')}<section class="print-case"><h2>Final synthesis</h2><p><b>Passion → Death → Resurrection → Ascension.</b> Jesus' saving work is the Paschal Mystery. The five case files move from real suffering and mockery, through scriptural interpretation of the Passion, to Easter hope and a mission for all nations.</p><p>Important distinction: Christians read Psalm 22 in light of Christ without forgetting its own literary and historical context. See CCC 112–117, 599–618, 638–655, 849–851.</p></section>`}
$('page').addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.go!==undefined){go(Number(button.dataset.go));return}if(button.dataset.reveal){setReveal(button.dataset.reveal);return}if(button.dataset.focus){focus=button.dataset.focus;render();return}});
$('tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-go]');if(b)go(Number(b.dataset.go))});
$('prevBtn').addEventListener('click',()=>go(stage-1));$('nextBtn').addEventListener('click',()=>go(stage+1));$('revealNextBtn').addEventListener('click',revealNext);$('revealAllBtn').addEventListener('click',revealAll);$('hideCurrentBtn').addEventListener('click',conceal);
$('notesBtn').addEventListener('click',()=>{showNotes=!showNotes;render();notify(showNotes?'Teaching notes are visible on screen.':'Teaching notes concealed.')});
$('smallerBtn').addEventListener('click',()=>setSize(-1));$('largerBtn').addEventListener('click',()=>setSize(1));
$('fullBtn').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen()}catch(e){notify('Fullscreen is unavailable in this browser. Use F11 instead.')}});
document.addEventListener('keydown',e=>{const tag=e.target.tagName;if(e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(tag))return;const k=e.key.toLowerCase();if(k==='arrowleft'){e.preventDefault();go(stage-1)}else if(k==='arrowright'){e.preventDefault();go(stage+1)}else if(k==='r'){e.preventDefault();revealNext()}else if(k==='h'){e.preventDefault();conceal()}else if(k==='f'){e.preventDefault();$('fullBtn').click()}else if(k==='+'||k==='='){e.preventDefault();setSize(1)}else if(k==='-'){e.preventDefault();setSize(-1)}});
buildPrint();render();
})();
</script>
</body>
</html>
