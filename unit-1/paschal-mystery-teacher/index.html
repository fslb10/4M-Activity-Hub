<script>
(() => { 'use strict';
const caseFiles=[{"number":"01","tab":"The Cry","name":"A cry that echoes","sub":"A familiar sentence changes meaning when you read the whole poem.","time":"4 min","evidence":[{"kind":"psalm","source":"OLD TESTAMENT","ref":"Psalm 22:1","excerpt":"“My God, my God, why have you forsaken me?”","desc":"The psalm begins with intense suffering and the feeling of being abandoned."},{"kind":"gospel","source":"THE GOSPELS","ref":"Matthew 27:46; Mark 15:34","excerpt":"Jesus cries out the opening words of Psalm 22.","desc":"As He suffers on the cross, Jesus gives voice to real human anguish."},{"kind":"support","source":"ADDITIONAL CLUE","ref":"Psalm 22:22–24; Luke 23:46","excerpt":"The psalm later moves toward praise. Jesus also entrusts His spirit to the Father.","desc":"What do these later words contribute to the meaning of His cry?"}],"notice":"What should you do before deciding Jesus has completely lost trust in God?","choices":["Read only the first line of Psalm 22.","Read how the rest of Psalm 22 develops.","Assume Jesus did not experience real suffering."],"correct":1,"rationale":"Reading the whole psalm matters. Its opening expresses anguish, but its later verses speak of God hearing the sufferer and lead toward praise.","question":"How does Psalm 22:1 help us understand Jesus’ suffering on the cross? What does this tell us about His trust in God despite His suffering?","steps":["Describe what Jesus’ cry reveals about His suffering.","Look at how Psalm 22 develops, especially verses 22–24.","Explain how pain and trust in the Father can exist together."],"model":"By praying the opening words of Psalm 22, Jesus expresses the genuine pain and sense of abandonment He experiences on the cross. However, Psalm 22 does not end in despair; it moves toward trust and praise because God hears the sufferer. Jesus’ cry shows that deep suffering and faithful trust can exist together, especially when we also consider His prayer of surrender to the Father in Luke 23:46.","unpack":[{"heading":"Begin with the real human experience","text":"Jesus does not pretend that suffering is painless. His cry expresses anguish and gives voice to the experience of those who feel abandoned."},{"heading":"Read the entire psalm","text":"Psalm 22 begins as lament but later affirms that God has heard the afflicted person (vv. 22–24). The opening line should not be treated as the final message."},{"heading":"Explain trust without minimizing the pain","text":"Luke 23:46 also records Jesus entrusting Himself to the Father. Read together, these passages point to profound suffering without a complete abandonment of trust."}],"affirm":["“Jesus knows what human suffering feels like.”","“The whole psalm changes how we understand its first line.”","“Trusting God does not mean never feeling despair or fear.”"],"avoid":["Do not say Jesus was only acting or that His pain was not real.","Do not present the cry as proof that the Father stopped loving the Son or that the Trinity was broken.","Avoid implying that all suffering is quickly resolved."],"discuss":["Can a person still have faith while asking God a painful question?","What changes when we read verse 1 alongside verses 22–24?"],"refs":["CCC 603","CCC 612","CCC 614"],"lens":"Interpretive key: lament is a form of prayer, not necessarily a rejection of faith. Emphasize the unity of the psalm and the Gospel without collapsing their historical settings.","hints":["Re-read the opening line. What human emotion do you hear?","Now look at Psalm 22:22–24 and Luke 23:46. Does the story end with the feeling expressed in verse 1?"]},{"number":"02","tab":"The Mockery","name":"Power or weakness?","sub":"When people mock Jesus, what kind of Messiah are they expecting?","time":"4 min","evidence":[{"kind":"psalm","source":"OLD TESTAMENT","ref":"Psalm 22:7–8","excerpt":"“All who see me mock at me.”","desc":"The sufferer is ridiculed; people challenge God to rescue someone who trusts in Him."},{"kind":"gospel","source":"THE GOSPELS","ref":"Matthew 27:39–43","excerpt":"The onlookers mock Jesus and challenge Him to save Himself.","desc":"They see His remaining on the cross as evidence against His claim to be the Messiah."}],"notice":"What assumption is behind the mockers’ words in both passages?","choices":["A true saviour should visibly escape humiliation and suffering.","The Messiah’s mission involves reaching all nations.","A faithful person should always keep silent."],"correct":0,"rationale":"The mockers assume that a true Messiah would prove His power by escaping suffering. Jesus shows a different kind of power through self-giving love.","question":"Compare Psalm 22:7–8 with Matthew 27:39–43. How does the mockery Jesus received on the cross echo the psalm? What does it reveal about how people misunderstood His mission?","steps":["Identify one similar action or idea in the two passages.","Explain what the mockers expect Jesus to do.","Contrast their idea of power with Jesus’ mission of sacrificial love."],"model":"In both Psalm 22 and Matthew 27, people ridicule someone who suffers and challenge God to rescue him. The people mocking Jesus believe that a real Messiah should prove His power by coming down from the cross. They misunderstand His mission because Jesus does not save the world by avoiding sacrifice; He remains faithful and gives Himself in love for others.","unpack":[{"heading":"Identify the literary echo","text":"Psalm 22:7–8 describes onlookers mocking a person who trusts in God; Matthew 27:39–43 portrays Jesus being mocked in a similar way."},{"heading":"Name the false expectation","text":"The crowd connects divine power with public success or dramatic escape. They expect the Messiah to save Himself visibly."},{"heading":"Contrast that with the Cross","text":"In Catholic understanding, Jesus freely gives Himself for humanity. The Cross reveals love, obedience, and redemption rather than the absence of divine power."}],"affirm":["“They want Jesus to prove Himself by escaping.”","“They confuse power with avoiding weakness.”","“Jesus’ sacrifice is central to His mission.”"],"avoid":["Do not describe Jesus as helpless or as lacking divine power.","Do not imply everyone present at the crucifixion responded in the same way.","Do not treat the echo as proof that Psalm 22 was written as a first-person Gospel report."],"discuss":["Why do people often think strength means never being vulnerable?","Can choosing to stay and help someone be stronger than escaping hardship?"],"refs":["CCC 609","CCC 610","CCC 615"],"lens":"Teaching contrast: the mockers recognize humiliation but miss redemptive love. Connect this case to the earlier question about real suffering.","hints":["In both passages, someone who suffers is laughed at for trusting God.","Why do the onlookers think coming down from the cross would prove Jesus is the Messiah?"]},{"number":"03","tab":"The Wounds","name":"Read the details carefully","sub":"Two texts, one striking connection, and a translation detail worth noticing.","time":"4 min","evidence":[{"kind":"psalm","source":"OLD TESTAMENT","ref":"Psalm 22:16","excerpt":"“My hands and feet have shriveled.”","desc":"This is the wording of the NRSV-CE. Some other translations use “they have pierced my hands and feet.” The Hebrew phrase is uncertain."},{"kind":"gospel","source":"THE GOSPELS","ref":"John 19:18; John 20:25–27","excerpt":"Jesus is crucified; the risen Jesus bears the marks of nails.","desc":"Thomas asks to examine the marks. Jesus later invites him to do so, although John does not say that Thomas actually touches them."},{"kind":"support","source":"ONE MORE PARALLEL","ref":"Psalm 22:18; John 19:23–24","excerpt":"Clothing is divided, and lots are cast.","desc":"Compare this additional detail in the psalm with John’s crucifixion account."}],"notice":"Which statement shows the most careful reading of the evidence?","choices":["Every Bible translation uses precisely the same words.","John explicitly says Thomas touches Jesus’ wounds.","Psalm 22:16 has translation differences; Christians read it alongside the Gospel accounts."],"correct":2,"rationale":"The NRSV-CE text differs from some other translations. John mentions the nail marks and Jesus’ invitation to Thomas, but does not explicitly say Thomas touched His wounds.","question":"Some translations of Psalm 22:16 describe pierced hands and feet. Compare this verse with John 19:18 and John 20:25–27. How do Christians connect this earlier psalm with Jesus’ crucifixion, and why is that connection significant?","steps":["Describe the imagery of suffering in Psalm 22 and the wounds mentioned in John.","Explain the connection Christians see between the earlier text and Jesus.","Acknowledge that the wording of Psalm 22:16 varies between translations."],"model":"Christians read the suffering described in Psalm 22 in light of Jesus’ crucifixion and the nail marks mentioned in John 20. Some translations of Psalm 22:16 refer to pierced hands and feet, while the NRSV-CE says that the hands and feet have shriveled, so the precise wording is uncertain. The connection matters because it helps Christians see how the earlier Scriptures illuminate Jesus’ Passion, especially when read alongside the more direct parallel about dividing garments in Psalm 22:18 and John 19:23–24.","unpack":[{"heading":"State exactly what the texts say","text":"John 19:18 states that Jesus was crucified; John 20:25–27 mentions the marks of nails and Jesus’ invitation to Thomas. The text does not say that Thomas actually touches Him."},{"heading":"Recognize the translation difference","text":"In the NRSV-CE Psalm 22:16 reads “My hands and feet have shriveled.” Other translations use “pierced.” The underlying Hebrew phrase is textually difficult."},{"heading":"Explain typology responsibly","text":"Christians see a pattern in the suffering of Psalm 22 and the Passion of Jesus. Psalm 22:18 and John 19:23–24 provide another specific link involving divided clothing and lots."}],"affirm":["“Translation choices affect the way we describe the parallel.”","“The Gospel tells us about Jesus’ crucifixion and wounds.”","“Psalm 22 can be read in light of Christ without pretending the textual difficulty is not there.”"],"avoid":["Do not say all translations of Psalm 22:16 contain the word “pierced.”","Do not claim John records Thomas physically touching the wounds.","Do not call this an undisputed word-for-word prediction of Roman crucifixion."],"discuss":["Why is acknowledging uncertainty part of careful biblical interpretation?","Does recognizing a translation difference erase the theological connection? Why or why not?"],"refs":["CCC 112","CCC 115–117","CCC 601"],"caution":"Translation detective: The NRSV-CE has “My hands and feet have shriveled” and notes that the Hebrew is uncertain. Some Christian translations read “they have pierced my hands and feet.” Do not claim that all translations agree, or that crucifixion was invented by the Romans.","lens":"This is the strongest exegesis check in the activity. Invite students to distinguish (a) what the Hebrew/translation says, (b) what John reports, and (c) the Christian theological interpretation.","hints":["Look closely at John 20:25. What proof does Thomas ask for?","How might Christians understand earlier Scripture more deeply in light of Jesus’ Passion, while still reading the wording accurately?"]},{"number":"04","tab":"The Turn","name":"The turning point","sub":"Psalm 22 does not end where it begins. Neither does the Gospel story.","time":"4 min","evidence":[{"kind":"psalm","source":"OLD TESTAMENT","ref":"Psalm 22:1, 22–24","excerpt":"The poem moves from a cry of distress to a declaration of praise.","desc":"The speaker tells others about God and affirms that God has heard the suffering one."},{"kind":"gospel","source":"THE GOSPELS","ref":"Luke 23:46; John 20:25–27","excerpt":"Jesus entrusts Himself to the Father; afterward the risen Jesus appears.","desc":"The Passion and death of Jesus are not the final chapter of the Paschal Mystery."}],"notice":"Which two-part pattern best captures the movement of Psalm 22?","choices":["Praise and celebration → isolation and fear","Lament and suffering → trust and praise","Resurrection → the Last Supper"],"correct":1,"rationale":"Psalm 22 begins with lament and later moves toward public praise and confidence in God. Christians recognize a meaningful parallel with the movement from the Cross to Easter.","question":"Psalm 22 moves from suffering to hope in verses 22–24. How does this transition mirror the shift from Jesus’ Passion to His Resurrection? How does it illuminate the Christian belief in redemption?","steps":["Name the mood at the beginning and near the end of the psalm.","Connect that shift with Jesus’ Passion, death, and Resurrection.","Explain why the Resurrection, not suffering by itself, is central to Christian hope."],"model":"Psalm 22 begins with anguish but moves toward praise and the belief that God has heard the sufferer. Christians see a similar movement in Jesus’ Paschal Mystery: His Passion and death are real, but they are not the end because He rises from the dead. This helps explain redemption as God’s victory over sin and death through Christ, rather than the idea that suffering alone brings salvation.","unpack":[{"heading":"Describe the shift accurately","text":"The psalm changes from an urgent plea for help to praise and proclamation. It does not itself narrate Jesus’ Resurrection."},{"heading":"Connect, but do not equate, the accounts","text":"The Gospel account moves from Jesus’ suffering and death to the reality of His Resurrection. Christians read this through the hope expressed in the psalm."},{"heading":"Identify why the Resurrection matters","text":"In Catholic faith, Jesus rises as victor over death. The Paschal Mystery includes His saving Passion, death, Resurrection, and Ascension; it is not simply a story about enduring pain."}],"affirm":["“The psalm changes from despair to praise.”","“The Crucifixion is not the end of Jesus’ story.”","“Christian hope is rooted in the Resurrection.”"],"avoid":["Do not say Psalm 22 literally tells the full Easter narrative.","Do not imply that all human suffering ends with an immediate happy outcome.","Do not reduce redemption to a general lesson that suffering makes people stronger."],"discuss":["What would the Christian message lose if Jesus’ story ended at the Cross?","What is the difference between optimism and Christian hope?"],"refs":["CCC 638","CCC 654","CCC 655"],"lens":"Use the full Paschal sequence as a bridge here. Resurrection is an event central to salvation, not merely a metaphor for feeling better.","hints":["Think about the difference between the opening cry and the later praise of God.","Christian faith does not say every difficulty ends quickly or happily. What is unique about Christ’s victory over death?"]},{"number":"05","tab":"All Nations","name":"A message for the world","sub":"The hope at the end of the psalm reaches far beyond one person.","time":"4 min","evidence":[{"kind":"psalm","source":"OLD TESTAMENT","ref":"Psalm 22:27–28","excerpt":"“All the ends of the earth” turn to the Lord.","desc":"The conclusion imagines the families of the nations worshipping God."},{"kind":"gospel","source":"THE GOSPELS","ref":"Matthew 28:19–20","excerpt":"“Go therefore and make disciples of all nations.”","desc":"The risen Jesus sends His disciples beyond their immediate community and promises to be with them."}],"notice":"Who is included in the scope of this mission?","choices":["Only those who witnessed the crucifixion","Every nation and people, not just one group","Only the first twelve apostles"],"correct":1,"rationale":"Both passages use universal language. The psalm envisions all peoples turning to God, and the risen Jesus sends disciples to all nations.","question":"Psalm 22:27–28 speaks of “all the ends of the earth” turning to God. How does this connect to the Great Commission in Matthew 28:19–20? What does it teach us about the universal mission of salvation?","steps":["Identify the phrase showing the wide reach of Psalm 22.","Explain what Jesus tells the disciples to do after His Resurrection.","Connect both to the Christian belief that the Gospel is offered to every nation."],"model":"Psalm 22 imagines people from all the ends of the earth turning to God, while the risen Jesus tells His disciples to make disciples of all nations. These passages show that God’s saving plan is not limited to one people or place. The Church continues this universal mission by proclaiming the Gospel, baptizing, teaching, and witnessing to Christ’s love throughout the world.","unpack":[{"heading":"Notice the shared universal language","text":"“All the ends of the earth” and “all nations” show that the message concerns every people, not only one region or group."},{"heading":"Distinguish vision from command","text":"Psalm 22 expresses a vision of worldwide worship. Matthew 28:19–20 gives the risen Lord’s specific commission to His followers."},{"heading":"Link salvation to mission","text":"Jesus sends disciples to baptize, teach, and make disciples. In Catholic understanding the Church is missionary by nature, sharing Christ’s salvation with all."}],"affirm":["“The message is meant for everyone, not just the original disciples.”","“Psalm 22 imagines all nations worshipping God.”","“Jesus gives His followers a concrete mission.”"],"avoid":["Do not say “universal mission” means every individual automatically believes or is saved.","Do not reduce evangelization to travelling; witness, service, teaching, and sacramental life also matter.","Do not present the psalm as though it contains Jesus’ Great Commission verbatim."],"discuss":["How can students share the Gospel without forcing it on others?","Why is the Church called “catholic” or universal?"],"refs":["CCC 849","CCC 850","CCC 851"],"lens":"This is the connection to Church history and Pentecost. Follow the line from Easter to the Great Commission to the missionary Church.","hints":["Underline the idea that appears in both passages: “all the ends of the earth” and “all nations.”","The psalm describes a vision. Matthew records a mission. What is the connection between the two?"]}];
const STUDENT_URL='https://fslb10.github.io/Interactive-Lessons/paschal-mystery/';
const sourceUrl=ref=>'https://www.biblegateway.com/passage/?search='+encodeURIComponent(ref)+'&version=NRSVCE';
const stages=[{tab:'The Brief'},...caseFiles.map(c=>({tab:c.tab})),{tab:'Take-Up Sheet'}];
const revealed=caseFiles.map(()=>({check:false,answer:false,hints:0,choice:-1}));
const reviewRevealed=caseFiles.map(()=>false);
let stage=0,sequence=false,fontScale=1,toastTimer=0;
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const plural=n=>n===1?'answer':'answers';
const notify=s=>{const node=$('toast');node.textContent=s;node.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>node.classList.remove('show'),2500)};
function navigation(){const container=$('stageNav');container.innerHTML=stages.map((s,i)=>`<button type="button" class="stage-tab ${i===stage?'active':''}" data-go="${i}" ${i===stage?'aria-current="step"':''}><span class="number">${String(i).padStart(2,'0')}</span>${esc(s.tab)}${i>0&&i<=5&&revealed[i-1].answer?'<span class="check" aria-label="Model answer revealed">●</span>':''}</button>`).join('');container.querySelector('.active')?.scrollIntoView({block:'nearest',inline:'nearest'});}
function updateHeader(){const total=revealed.filter(x=>x.answer).length;$('progressText').textContent=total+' / 5';$('progressFill').style.width=(20*total)+'%';}
function intro(){const slots=sequence?['Passion','Death','Resurrection','Ascension']:['1','2','3','4'];return `<div class="intro-layout"><section class="intro-hero"><div class="intro-orbit" aria-hidden="true"><div class="orbit-small">XXII</div></div><div><div class="intro-super"><span class="intro-line"></span>A Scripture investigation · teacher take-up</div><h1 class="intro-title">Five clues.<br>One <em>mystery.</em></h1><p class="intro-copy">Hundreds of years before the Gospels, Psalm 22 told a story that moved from anguish to hope. Why did Jesus speak its opening words from the cross?</p></div><div class="intro-foot"><span class="tag">✦ Five case files</span><span class="tag">◇ Teacher responses</span><span class="tag">◷ Class discussion</span></div></section>
<div class="intro-right"><section class="panel start-card"><div class="kicker">YOUR MISSION</div><h2>Follow the evidence.</h2><p>Use the same questions and clues that students see. Invite their answers first, then reveal the teacher response in the original response area to fill in any missing ideas.</p><button class="btn btn-primary btn-full" type="button" data-go="1">Begin the investigation <span aria-hidden="true">→</span></button><p class="mini-note">Answers begin hidden. Each case has its own quick-check solution and model written response. The student activity is unchanged.</p><a class="scripture-link" href="${STUDENT_URL}" target="_blank" rel="noopener noreferrer">Open the student activity ↗</a></section>
<section class="panel warmup-card"><div class="kicker">30-SECOND WARM-UP</div><h3 class="warmup-title">Put the Paschal Mystery in order.</h3><p class="warmup-desc">Ask students to place the four moments in sequence.</p><div class="sequence-picks">${['Ascension','Death','Passion','Resurrection'].map(v=>`<button type="button" tabindex="-1">${v}</button>`).join('')}</div><div class="sequence-result" style="margin-top:13px">${slots.map((s,i)=>`<span class="slot" style="${sequence?'border-style:solid;border-color:#9fcdb7;background:#eaf5ed;color:#235e4e;font-weight:850;':''}">${s}</span>${i<3?'<span class="sequence-arrow">→</span>':''}`).join('')}</div><div class="sequence-feedback" aria-live="polite">${sequence?'✓ Passion → Death → Resurrection → Ascension':'The sequence is concealed. Ask the class first.'}</div><button class="btn ${sequence?'btn-muted':'btn-teal'}" type="button" id="toggleSequence" style="font-size:12px;min-height:39px;padding:9px 12px">${sequence?'Hide sequence':'Reveal correct sequence'}</button></section></div></div>`}
function evidenceCard(ev){const kind=ev.kind==='support'?'support':ev.kind==='gospel'?'gospel':'';return `<div class="evidence-card ${kind}"><div class="stripe"></div><div><div class="evidence-top"><small>${esc(ev.source)}</small><strong class="evidence-ref">${esc(ev.ref)}</strong></div><div class="evidence-excerpt">${esc(ev.excerpt)}</div><p class="evidence-desc">${esc(ev.desc)}</p><a class="scripture-link" href="${sourceUrl(ev.ref)}" target="_blank" rel="noopener noreferrer">Read passage (NRSV-CE) ↗</a></div></div>`;}
function casePage(i){const d=caseFiles[i],r=revealed[i];let opts=d.choices.map((c,j)=>`<button type="button" class="option ${r.check&&j===d.correct?'correct':r.choice===j?'selected':''}" data-pick="${j}" aria-pressed="${r.choice===j?'true':'false'}"><span class="option-dot">${r.check&&j===d.correct?'✓':String.fromCharCode(65+j)}</span><span>${esc(c)}</span></button>`).join('');return `<div class="section-top"><div><div class="kicker">CASE FILE ${d.number} / 05 · ${d.time} suggested</div><h1 class="serif">${esc(d.name)}</h1><p>${esc(d.sub)}</p></div><div class="case-num-box"><span>✦</span> Scripture investigation <strong>${d.number}/05</strong></div></div>
<div class="case-grid"><div class="evidence-column"><section class="panel evidence-area"><div class="box-head"><strong>① Read the clues</strong><span>Look for a connection</span></div>${d.evidence.map(evidenceCard).join('')}<div class="reading-prompt"><span class="spark" aria-hidden="true">✧</span><div><strong>Reading tip:</strong> Compare the language and the larger context of the psalm and the Gospel. You can also open the complete passages in the NRSV-CE above.</div></div>${d.caution?`<div class="caution">${esc(d.caution)}</div>`:''}</section>
<section class="micro" aria-label="Quick evidence check"><small>② Stop &amp; notice</small><h3>${esc(d.notice)}</h3><div class="micro-options">${opts}</div><div class="micro-feedback" ${r.check?'':'hidden'}><strong>Correct: ${String.fromCharCode(65+d.correct)}.</strong> ${esc(d.rationale)}</div><div class="micro-reveal"><button type="button" class="reveal-quiz" id="toggleCheck">${r.check?'Hide correct answer':'Reveal correct answer'}</button></div></section></div>
<div class="answer-column"><section class="panel answer-panel"><div class="answer-topline"><small>③ Make your case</small><span class="answer-status"><span class="status-dot ${r.answer?'done':''}"></span>${r.answer?'Teacher response visible':'Teacher response hidden'}</span></div><h2 class="question-title">${esc(d.question)}</h2><div class="scaffold"><div class="scaffold-header">Build your answer</div><ol class="scaffold-steps">${d.steps.map(t=>`<li>${esc(t)}</li>`).join('')}</ol></div>
<div class="answer-label"><strong>Teacher response</strong><span>Aim for 2–4 clear sentences</span></div>${r.answer?`<div class="answer-area model-answer" role="region" aria-label="Teacher model answer">${esc(d.model)}</div>`:`<div class="answer-area concealed" role="region" aria-label="Teacher response concealed"><span class="lock" aria-hidden="true">◇</span><span>Teacher response is hidden.<br>Ask students to share first, then reveal the answer.</span></div>`}
<div class="answer-foot"><span>${r.answer?'Model answer, not the only acceptable wording':'Answer hidden until you reveal it'}</span><span>${r.answer?'Model response':'Ready for class take-up'}</span></div><div class="answer-tools"><button class="btn ${r.answer?'btn-muted':'btn-teal'}" type="button" id="toggleAnswer">${r.answer?'Hide teacher response':'Reveal teacher response'}</button></div><div class="bottom-actions"><button class="btn btn-muted" type="button" data-go="${i===0?0:i}">← Back</button><button class="btn btn-teal" type="button" data-go="${i===4?6:i+2}">${i===4?'Prepare Take-Up Sheet':'Next case file →'}</button></div><div class="save-label"><span aria-hidden="true">✓</span> Use the model answer to reinforce key ideas, not as the only correct wording.</div></section>
<section class="panel hint-card"><div class="hint-header"><strong>Need a nudge?</strong><button type="button" id="toggleHint" ${r.hints>=2?'disabled':''}>${r.hints===0?'Reveal hint 1':r.hints===1?'Reveal hint 2':'All hints revealed'}</button></div>${r.hints>0?`<p class="hint-text"><strong>Hint 1:</strong> ${esc(d.hints[0])}</p>`:''}${r.hints>1?`<p class="hint-text"><strong>Hint 2:</strong> ${esc(d.hints[1])}</p>`:''}</section></div></div>`}
function takeup(){return `<div class="student-print-head"><h1>Psalm 22 · The Paschal Mystery</h1><p>HRE4M1 · Unit 1.5 · Teacher responses</p></div><section class="review-head"><div class="kicker">CLASS DISCUSSION / TEACHER ANSWERS</div><h1>Your take-up sheet.</h1><p>The same five questions students see on their final take-up sheet, with teacher model responses available to reveal one at a time.</p><div class="review-tools"><button type="button" class="btn btn-primary" id="printKeyButton">▣ Print / Save teacher key as PDF</button><button type="button" class="btn btn-muted" id="revealReviewAll">${reviewRevealed.every(Boolean)?'Hide all model answers':'Reveal all model answers'}</button></div></section><div class="review-layout"><div class="review-list">${caseFiles.map((d,i)=>`<section class="panel review-item"><div class="review-meta"><small>Question ${i+1} · ${esc(d.tab)}</small><div><button type="button" data-review="${i}">${reviewRevealed[i]?'Hide answer':'Reveal answer'}</button> <button type="button" data-go="${i+1}">Case file ↗</button></div></div><p class="review-q">${esc(d.question)}</p><p class="review-response ${reviewRevealed[i]?'':'hidden'}">${reviewRevealed[i]?esc(d.model):'Teacher response hidden. Invite students to share before revealing.'}</p></section>`).join('')}</div><aside class="panel review-side"><div class="kicker">BEFORE WE DISCUSS</div><h3>Ready to take it up?</h3><ul><li>Ask students what they noticed in the Scripture evidence.</li><li>Let them explain their response in their own words.</li><li>Reveal the matching model answer to reinforce or clarify the key ideas.</li><li>Accept other reasonable interpretations grounded in the passages.</li></ul><p>The same passages and question order appear in the student version.</p><a class="scripture-link" href="${STUDENT_URL}" target="_blank" rel="noopener noreferrer">Open student activity ↗</a><div style="margin-top:22px"><button type="button" class="btn btn-muted btn-full" data-go="1">← Return to case files</button></div></aside></div>`}
function render(){navigation();$('stageArea').innerHTML=stage===0?intro():stage===6?takeup():casePage(stage-1);updateHeader();}
function go(n){if(!Number.isInteger(n)||n<0||n>6)return;stage=n;render();window.scrollTo({top:0,behavior:'instant'});}
function updateReveal(which){const r=revealed[stage-1];if(!r)return;r[which]=!r[which];render();}
function reset(){revealed.forEach(r=>{r.check=false;r.answer=false;r.choice=-1;r.hints=0});reviewRevealed.fill(false);sequence=false;render();notify('Answers concealed. Ready to start the take-up again.');}
function teacherPrint(){window.print();}
function setScale(d){fontScale=Math.min(1.4,Math.max(.85,Math.round((fontScale+d)*100)/100));document.documentElement.style.setProperty('--scale',fontScale);notify('Text scale: '+Math.round(fontScale*100)+'%');}
function buildPrintKey(){const section=caseFiles.map(d=>`<section><h2>Case ${esc(d.number)} · ${esc(d.tab)}</h2><p><b>Student question:</b> ${esc(d.question)}</p><p><b>Quick check:</b> ${esc(d.notice)}</p><p><b>Correct answer (${String.fromCharCode(65+d.correct)}):</b> ${esc(d.choices[d.correct])}</p><p>${esc(d.rationale)}</p><h3>Model teacher response</h3><p>${esc(d.model)}</p><p><b>Scripture references:</b> ${d.evidence.map(x=>esc(x.ref)).join('; ')}</p></section>`).join('');$('printKey').innerHTML=`<h1>Psalm 22 · The Paschal Mystery</h1><p><strong>HRE4M1 · Unit 1.5 · Teacher Answer Key</strong></p><p>This is a model answer key, not an exhaustive list of possible correct responses. The sequence and wording of questions match the student investigation.</p><h2>30-second warm-up</h2><p><b>Passion → Death → Resurrection → Ascension.</b></p>${section}`;}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-go')){go(Number(b.dataset.go));return}
 if(b.hasAttribute('data-pick')&&stage>=1&&stage<=5){revealed[stage-1].choice=Number(b.dataset.pick);render();return}
 if(b.hasAttribute('data-review')){const n=Number(b.dataset.review);reviewRevealed[n]=!reviewRevealed[n];render();return}
 switch(b.id){case'toggleSequence':sequence=!sequence;render();break;case'toggleCheck':updateReveal('check');break;case'toggleAnswer':updateReveal('answer');break;case'toggleHint':revealed[stage-1].hints=Math.min(2,revealed[stage-1].hints+1);render();break;case'printKeyButton':teacherPrint();break;case'revealReviewAll':{const mode=!reviewRevealed.every(Boolean);reviewRevealed.fill(mode);render();break}case'resetAll':reset();break;case'smallText':setScale(-.1);break;case'largeText':setScale(.1);break;case'fullscreen':if(document.fullscreenElement){document.exitFullscreen().catch(()=>notify('Use F11 for fullscreen.'))}else{document.documentElement.requestFullscreen().catch(()=>notify('Use F11 for fullscreen.'))}break;}
});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(e.target?.tagName))return;const k=e.key.toLowerCase();if(k==='arrowright'){e.preventDefault();go(Math.min(6,stage+1));}else if(k==='arrowleft'){e.preventDefault();go(Math.max(0,stage-1));}else if(k==='r'&&stage>0&&stage<6){e.preventDefault();updateReveal('answer')}else if(k==='c'&&stage>0&&stage<6){e.preventDefault();updateReveal('check')}else if(k==='h'&&stage>0&&stage<6){e.preventDefault();revealed[stage-1].answer=false;revealed[stage-1].check=false;render()}else if(k==='f'){e.preventDefault();$('fullscreen').click()}});
buildPrintKey();render();
})();
</script>
</body>
</html>
