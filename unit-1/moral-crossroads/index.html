<script>
'use strict';
(()=>{
const KEY='hre4m_moral_crossroads_2026_v1';
const CCC={natural:'https://www.vatican.va/content/catechism/en/part_three/section_one/chapter_three/article_1/i_the_natural_moral_law.index.html',conscience:'https://www.vatican.va/content/catechism/en/part_three/section_one/chapter_one/article_6/i_the_judgment_of_conscience.html',formation:'https://www.vatican.va/content/catechism/en/part_three/section_one/chapter_one/article_6/ii_the_formation_of_conscience.html',moral:'https://www.vatican.va/content/catechism/en/part_three/section_one/chapter_one/article_4/i_the_sources_of_morality.index.html',virtue:'https://www.vatican.va/content/catechism/en/part_three/section_one/chapter_one/article_7/i_the_human_virtues.index.html',faith:'https://www.vatican.va/content/catechism/en/part_three/section_one/chapter_one/article_7/ii_the_theological_virtues.index.html'};
const SCENARIOS=[
{id:'chat',icon:'◈',title:'The Group Chat',category:'Privacy · Respect · Community',setup:'A student sends a personal voice message to someone they trust. That person forwards it into a large group chat. Several students turn the recording into jokes. The original student is upset and asks people to stop sharing it. One member of your group is in the chat and has screenshots that show who began sharing the message.',a:'Contact a trusted adult at school promptly, preserve the evidence privately, and ask for help stopping the sharing.',b:'Contact the person who forwarded it, insist that they remove it, support the affected student, and involve a trusted adult if the harm does not stop promptly.',tension:'Protection from harm, personal dignity, responsibility, restorative action, and the need to respond quickly.',twist:'New information: the voice message has already been forwarded outside the school. The original student is now staying home because of the humiliation.',twistHint:'Ask whether the increased harm affects urgency, without changing the basic dignity owed to the person.',avoid:'Do not forward the private recording to make your point. Protect the student while preserving necessary evidence appropriately.'},
{id:'test',icon:'◇',title:'The Test and the Friendship',category:'Honesty · Loyalty · Fairness',setup:'A close friend tells you they used a copy of an answer key to get a higher mark on an important test. They say they were overwhelmed and cannot risk a poor grade. Other students worked honestly, and the mark may affect academic opportunities. Your friend asks you not to tell anyone.',a:'Explain that you cannot conceal the cheating and bring the concern directly to the teacher.',b:'Ask your friend to tell the teacher themselves that day, offer to go with them, and tell the teacher if they refuse.',tension:'Truth, justice to other students, mercy, loyalty, responsibility, and opportunities for repentance.',twist:'New information: the teacher is about to finalize the marks, and the dishonest mark would change who receives a limited school award.',twistHint:'Does limited time change how quickly the truth must be brought forward?',avoid:'Do not frame indefinitely hiding cheating as a morally acceptable form of friendship.'},
{id:'shelter',icon:'✧',title:'The Cold-Weather Shelter',category:'Human dignity · Safety · Common good',setup:'During a severe cold spell, a local community hall may be used as a temporary overnight warming space. Volunteers are ready, but the hall has not yet completed its safety plan. Some neighbours worry about disruptions. Several people have nowhere warm to stay tonight, and established shelters are full.',a:'Open a temporary warming space tonight with immediate safety measures, staffing, supervision, and coordination with emergency services.',b:'Prioritize arranging safe emergency accommodations through local agencies immediately, opening the hall only when essential safety arrangements are ready.',tension:'Urgent care for vulnerable people, safety, responsible planning, dignity, and the common good.',twist:'New information: the community hall has working heat and accessible washrooms, but no designated overnight coordinator is yet available.',twistHint:'Which facts matter to practical judgment, and which moral duties remain constant?',avoid:'Both positions must address the immediate need for warmth. Doing nothing is not the default moral answer.'},
{id:'work',icon:'▣',title:'Unpaid Hours at Work',category:'Justice · Work · Courage',setup:'A student with a part-time job is told to stay three extra hours without pay because the store is short-staffed. The manager calls it an opportunity to show dedication. The student is worried about losing future shifts and knows other students have experienced something similar.',a:'Document the hours and raise the concern directly with the manager, then escalate through proper channels if it is not corrected.',b:'Document the hours and make a formal complaint through an appropriate workplace or labour support channel without confronting the manager alone.',tension:'Fair treatment, employer responsibilities, fear of retaliation, solidarity with coworkers, and prudent action.',twist:'New information: another young worker says this has happened repeatedly, and the manager told them not to record overtime.',twistHint:'Does a pattern of conduct change the seriousness of the problem or what support should be involved?',avoid:'Neither approach requires the student to accept exploitation. Safety and support matter when there is a power imbalance.'},
{id:'team',icon:'✦',title:'The Final Team Position',category:'Fairness · Character · Responsibility',setup:'A school team has one remaining roster position. One athlete performs very well but has repeatedly humiliated less experienced teammates. Another athlete is somewhat less skilled but consistently supports others and trains hard. The coaches have published both performance and sportsmanship as selection criteria.',a:'Choose the more skilled athlete only if clear behavioural expectations and accountability measures can genuinely protect teammates.',b:'Choose the supportive athlete, giving significant weight to team culture, published sportsmanship criteria, and student dignity.',tension:'Merit, fairness, character, growth, dignity, and the effects of decisions on the whole community.',twist:'New information: the more skilled athlete has apologized, begun changing their behaviour, and asked for a chance to rebuild trust, but some teammates remain uncomfortable.',twistHint:'How can mercy, accountability, and justice be considered without dismissing those who were harmed?',avoid:'Do not excuse bullying merely because someone is talented. The question is how to exercise fair and prudent judgment.'},

const isFilled=(v)=>typeof v==='string'?!!v.trim():v!==null&&v!==undefined&&v!=='';
const progress=(p)=>{const paths=REQUIRED[p].flat();const done=paths.filter(k=>isFilled(get(k))).length;return {done,total:paths.length,pct:Math.round(done/paths.length*100)};};

function home(){let p1=progress('p1'),p2=progress('p2');return `<main class="main"><div class="hero"><div>${stamp('p1','GUIDED INQUIRY')}<h1>The Moral<br><span>Crossroads.</span></h1><p class="lead">When we decide whether something is right or wrong, <strong>what are we judging it against?</strong> Explore the Catholic understanding of objective moral truth, then apply conscience, reason, and virtue to real choices.</p><div class="heroactions"><button class="btn" data-action="go-p1">Begin Part 1 ${icon('→')}</button><button class="btn alt" data-action="go-p2">Open Part 2 ${icon('→')}</button></div></div><div class="heroart" role="img" aria-label="Stylized compass representing a search for moral truth"><span class="compass">✦</span><span class="compasscaption">A clear standard · A formed conscience · A free choice</span></div></div><div class="grid2"><article class="module"><span class="tag">15–20 MIN · SOLO OR PARTNERS</span><h3>Part 1: Compared to What?</h3><p>Complete after Lesson 1.11. Discover the difference between a moral truth and an opinion, why popularity and legality do not determine goodness, and why Catholics understand God as the ultimate moral standard.</p><div class="foot"><span class="small muted">${p1.done} / ${p1.total} responses · ${p1.pct}%</span><button class="btn sm" data-action="go-p1">${p1.done?'Continue':'Start'} Part 1 →</button></div></article><article class="module two"><span class="tag">45–60 MIN · GROUPS OF FOUR</span><h3>Part 2: The Moral Crossroads</h3><p>Complete after Lesson 1.12. Investigate a contemporary case, debate two responses, examine object, intention, and circumstances, then make a reasoned judgment through Catholic moral teaching.</p><div class="foot"><span class="small muted">${p2.done} / ${p2.total} responses · ${p2.pct}%</span><button class="btn sm alt" data-action="go-p2">${p2.done?'Continue':'Start'} Part 2 →</button></div></article></div><div class="home-strip"><div class="metric"><b>Objective truth</b><span>What makes an action good?</span></div><div class="metric"><b>Conscience</b><span>How do we judge what to do?</span></div><div class="metric"><b>Free choice</b><span>How do we live the good?</span></div></div><div class="muted-panel" style="margin-top:23px"><h3>How to use this activity</h3><p>Part 1 works individually or with a partner. For Part 2, make a group of up to four, choose one of the six cases, and assign two students to each proposed response. You may disagree with your assigned viewpoint; your job is to understand and assess the reasoning. You are being asked to <strong>explain Catholic teaching accurately, not to profess personal belief in it.</strong></p><p class="small muted" id="save-line">${saved?'Responses save automatically on this device.':'This browser did not allow local saving. Export your work before closing.'} Use Export to download answers for your teacher or to preserve work between devices. No account, connection, or server is required.</p></div><div class="bottom-note">Catholic sources and lesson references are included where relevant. This activity does not send responses anywhere.</div></main>`;}

function pageHead(label,title,summary){return `<div class="pagehead"><div class="stage">${esc(label)}</div><h2>${title}</h2><p>${summary}</p></div>`;}
function part1(n){
if(n===0)return `${pageHead('Part 1 · Step 1 of 5','What are we measuring?','Before we discuss Catholic theology, notice that not every kind of judgment is the same.')}
${box('Start with two statements',`<div class="two-columns"><div class="contrast"><b>Statement A</b>“Strawberry ice cream tastes better than chocolate.”</div><div class="contrast"><b>Statement B</b>“It is wrong to deliberately humiliate another person for entertainment.”</div></div><p style="margin-top:15px">The first statement expresses a taste or preference. The second makes a <strong>moral claim</strong> about how one person ought to treat another.</p><div class="note"><strong>The distinction:</strong> Someone can dislike a food without claiming everyone must dislike it. But when we say mistreating someone is wrong, we are claiming there is a reason people should not do it, even if they enjoy it.</div>`)}
${box('Your thinking',`${field('p1.diff','What is the difference between “I dislike this” and “This is wrong to do to another person”?','Try explaining the difference in 1–2 sentences.','Focus on preference versus a standard for how people ought to act.',3)}${hint('Ask: Is one sentence only about my taste, while the other is a claim about what anyone should or should not do?')}`)}
${box('Hold on to this question',`<div class="callout-question">When we call an action “good” or “bad,” what are we comparing it with?</div><p>You will return to this question throughout both parts. We are examining the <em>basis</em> of a judgment, not simply how strongly someone feels about it.</p>`,'warm')}`;
if(n===1)return `${pageHead('Part 1 · Step 2 of 5','If everyone agrees, is it right?','Explore the difference between social approval and moral truth.')}
${box('The situation',`<div class="case-hero"><h3>A message goes viral</h3><p>A student shares a private message to make fun of another student. Most people in the group chat laugh, nobody objects, and the student who shared it becomes more popular.</p><p><strong>The question:</strong> Does widespread approval automatically make that action morally right?</p></div>${choice('p1.approval', [['yes','Yes, approval makes it right','If most people accept the behaviour, that establishes the rule.'],['no','No, approval alone is not enough','The action might still be wrong, even if it is popular.'],['depends','I need to distinguish the issues','Popularity is one fact, but what other factors determine right and wrong?']])}${field('p1.approvalWhy','Explain your answer. What standard should be used to judge the action?','Use the dignity of the student, fairness, harm, or another moral principle.','Explain your reasoning, not only your choice.',3)}`)}
${box('Catholic connection',`<p><strong>According to Catholic teaching,</strong> a behaviour does not become morally good simply because many people approve of it. The human person has a dignity that should be respected even when a group fails to recognize it.</p><p>Notice the distinction: people can <em>agree about</em> an action and still be <em>mistaken about</em> it.</p>${hint('What has changed if a hundred people laugh rather than two? Has the person being humiliated lost any dignity?')}`,'softer')}`;
if(n===2)return `${pageHead('Part 1 · Step 3 of 5','Can a law be unjust?','A legal rule tells us what a society permits or requires. A moral judgment asks whether the rule itself is just.')}
${box('A historical example',`<div class="case-hero"><h3>When unfair treatment was legal</h3><p>At different points in history, governments have created laws that denied people equal treatment because of their race. Those laws were enforced, and many people defended them.</p><p>Today we can recognize that legal permission and social acceptance did not make such discrimination just.</p></div>${field('p1.unjustLaw','Why could those laws still be morally wrong, even though they were legal?','Identify the moral principle those laws failed to respect.','1–3 sentences. Do not simply say “because the law was bad.”',3)}${field('p1.recognize','How could someone recognize that injustice while living in a society that accepted it?','Consider human dignity, reason, empathy, faith, and the experiences of people affected.','A person does not need to wait for a majority vote to ask whether others are treated justly.',3)}`)}
${box('What this example shows',`<p>A law can be unjust. A majority can be mistaken. Even our own sincere judgments can be wrong. These examples invite a further question:</p><div class="callout-question">If a society can get morality wrong, what should we judge its actions against?</div><p>This question motivates the Catholic account of <strong>objective moral truth</strong>. It does not, by itself, prove God's existence.</p>`,'warm')}`;
if(n===3)return `${pageHead('Part 1 · Step 4 of 5','Compared with what?','Now connect the question of a moral standard with the Catholic understanding of God.')}
${box('A useful comparison',`<p>Imagine two students measuring the same desk. One says it is 120 centimetres long; another says it is 150 centimetres. Their disagreement does not mean the desk has no actual length. They need a trustworthy measure.</p><p>This is an <strong>analogy</strong>, not a proof. Moral decisions are more complicated than physical measurements. It helps us ask what we use as the standard when our moral judgments disagree.</p><div class="note gold"><strong>The Catholic answer:</strong> God is the ultimate source and standard of goodness. The Church teaches that moral truth is grounded in God's nature, not invented by individual preferences or social agreement.</div>`)}
${box('Discovering, not inventing',`<p>According to St. Thomas Aquinas, human beings share in God's wisdom through <strong>natural law</strong>, which we can recognize through reason. Natural law is not a list of whatever happens in nature. It is the moral order that human reason can discover.</p>${drop('p1.source','According to Catholic teaching, fundamental moral truths are best understood as…',[['invented','Invented by each person or culture.'],['discovered','Discovered through reason, with God as their ultimate source.'],['majority','Decided by whichever group has the most power.']])}${field('p1.nonbeliever','Can someone who does not believe in God recognize and choose what is morally good? Explain the Catholic answer.','Hint: Think about reason, human nature, and natural law.','2–3 sentences.',3)}${hint('The Catholic answer is yes. Natural law is accessible to human reason, and a person does not have to identify its divine source to recognize a moral truth. See CCC 1954–1960.')}${cite('Catechism, natural moral law (CCC 1954–1960)',CCC.natural)}`)}`;
if(n===4)return `${pageHead('Part 1 · Step 5 of 5','The bridge to conscience','You have explored what Catholic teaching says about the source of moral truth. The next lesson asks how we discover and act on it.')}
${box('Apply the idea',`<div class="case-hero"><h3>A small but real choice</h3><p>You find a lost wallet with cash and a contact card inside. Nobody saw you pick it up. You could keep it without being caught.</p><p>Now consider the action using a moral standard, not just the chance of a reward or punishment.</p></div>${field('p1.wallet','What moral principle should guide your decision, and what would you do?','Name the principle and one practical action.','Example of a principle: respect for another person’s property.',3)}${field('p1.bridge','If the moral principle is clear, why might someone still make the wrong choice?','Consider fear, temptation, habits, confusing circumstances, or pressure.','1–2 sentences.',3)}`)}
${box('Part 1 · What you have uncovered',`<div class="definition"><b>Objective moral truth</b><span>A moral truth that does not depend simply on what an individual or society believes.</span></div><div class="definition"><b>Catholic foundation</b><span>God is the ultimate source of goodness. Our judgments are measured against the good, not against mere popularity.</span></div><div class="definition"><b>Natural law</b><span>The moral law that human beings can recognize through reason, because we share in the wisdom of the Creator.</span></div><p class="small" style="margin-top:18px"><strong>Next lesson:</strong> If we are capable of recognizing the good, why do we sometimes disagree, make mistakes, or fail to act on what we know?</p><p>That question leads directly into conscience, morality, ethics, Aquinas, free will, virtue, and grace in Lesson 1.12.</p><div class="flex no-print" style="margin-top:16px"><button class="btn alt" data-action="go-p2">Go to Part 2 after the lesson →</button><button class="btn cream" data-action="export">Save or submit Part 1 ↗</button></div>`,'softer')}`;
return '';
}

function roleCards(){return `<div class="roles"><div class="role"><div class="role-names">TEAM A · ${esc(member(0))} and ${esc(member(1))}</div><b>Make the strongest case for Response A</b><p>Explain the moral values it seeks to protect. Acknowledge a weakness in your own position.</p></div><div class="role"><div class="role-names">TEAM B · ${esc(member(2))} and ${esc(member(3))}</div><b>Make the strongest case for Response B</b><p>Explain the moral values it seeks to protect. Acknowledge a weakness in your own position.</p></div></div>`;}
function selectCase(){return `<div class="field"><label for="p2.scenarioId">Choose your group’s case</label><p class="help">Groups may investigate different cases, making the class discussion more varied. Your teacher may assign one.</p><select id="p2.scenarioId" data-bind="p2.scenarioId"><option value="">Select a case…</option>${SCENARIOS.map(s=>`<option value="${s.id}" ${get('p2.scenarioId')===s.id?'selected':''}>${esc(s.title)} · ${esc(s.category)}</option>`).join('')}</select></div>`;}
function part2(n){const s=scenario();
if(n===0)return `${pageHead('Part 2 · Step 1 of 9','Prepare your group','You will consider two possible responses to a real-life moral dilemma. Your job is to explain, examine, and test the reasoning.')}
${box('Set up the group',`<div class="two-columns"><div class="field" style="margin-top:0"><label for="profile.period">Class period</label><select id="profile.period" data-bind="profile.period"><option value="">Select period (optional)</option>${[1,2,3,4,5].map(x=>`<option value="${x}" ${get('profile.period')===String(x)?'selected':''}>Period ${x}</option>`).join('')}</select></div><div class="field" style="margin-top:0"><label>Group size</label><div class="note" style="margin:0;padding:11px 13px">Works with 2–4 students. Four is ideal.</div></div></div><div class="group-rows" style="margin-top:15px">${[0,1,2,3].map(i=>`<div class="field"><label for="profile.members.${i}">Student ${i+1} ${i<2?'· Team A':'· Team B'}</label><input id="profile.members.${i}" data-bind="profile.members.${i}" value="${esc(member(i).startsWith('Member ')?'':get('profile.members.'+i))}" placeholder="First name or initials"></div>`).join('')}</div><p class="mini" style="margin-top:13px">Use first names or initials only. Responses stay locally on this browser until you export them.</p>`)}
${box('Choose a case',`${selectCase()}<p class="mini" style="margin-top:12px">Want a different case? <button class="subtle-button" data-action="random-case" type="button">Assign a random case</button></p><div id="case-preview">${get('p2.scenarioId')?scenarioView(s):'<div class="note">Pick a case to see the situation and two proposed responses.</div>'}</div>`)}
${box('Your discussion roles',`${roleCards()}<p class="small" style="margin-top:15px"><strong>Important:</strong> Defending a position in a debate is not the same as endorsing it. Your group should challenge weak arguments respectfully. Some disagreements are about which <em>practical response</em> is wisest, not whether a harmful action becomes good.</p><p class="small">Do not use personal stories about classmates in the written responses. Discuss only the fictional scenario.</p>`,'softer')}`;
if(n===1)return `${pageHead('Part 2 · Step 2 of 9','Your first judgment','Before discussing the case, make an initial judgment. You can revise it later as your understanding deepens.')}
${box('Read your group’s case',scenarioView(s))}
${box('Make a starting choice',`${choice('p2.initial',[['A','Response A','This seems like the better response at first.'],['B','Response B','This seems like the better response at first.'],['other','A different response','I think another action would better protect the good.']])}${field('p2.initialReason','Why did you choose that response?','Name the moral good or concern you are using to judge the options.','Write 2–3 sentences. Your answer can change later.',3)}${hint('Ask: Who might be helped or harmed? Whose dignity or rights are involved? Which response best protects the good?')}`)}
${box('Pause and notice',`<p>A moral judgment involves more than instinct or preference. You have already begun using <strong>morality</strong> (the principles of right and wrong), <strong>ethics</strong> (reasoning about the choice), and <strong>conscience</strong> (your judgment about what you ought to do in this case).</p>`,'softer')}`;
if(n===2)return `${pageHead('Part 2 · Step 3 of 9','Dialogue, not a shouting match','Each side explains the strongest moral reasons for its assigned response. Then listen carefully and challenge the reasoning.')}
${box('Your two positions',`${roleCards()}${scenarioView(s)}`)}
${box('Record your strongest arguments',`${field('p2.argA','Team A: Why might Response A be morally justified?','Explain the principle it protects and why it matters.','Write a fair and convincing argument, not simply “because we think so.”',3)}${field('p2.argB','Team B: Why might Response B be morally justified?','Explain the principle it protects and why it matters.','Try to make this argument as strong as Team A’s.',3)}${field('p2.challenge','Discussion: What is the strongest objection to each response?','Identify one possible risk or weakness of A, and one of B.','A challenge should question the reasoning, not criticize the person.',4)}`)}
${box('Conversation prompts',`<div class="definition"><b>Ask Team A</b><span>Which person or value are you most concerned about? What could go wrong with A?</span></div><div class="definition"><b>Ask Team B</b><span>Which duty or outcome matters most in B? What could go wrong with B?</span></div><div class="definition"><b>Ask everyone</b><span>Do you disagree about the <em>moral principle</em>, or about the best way to apply that principle?</span></div><div class="note">The best group discussion listens for sound reasons and recognizes that two people can share a moral value while proposing different responsible actions.</div>`,'softer')}`;
if(n===3)return `${pageHead('Part 2 · Step 4 of 9','Three ways to examine the choice','Your notes introduce several ethical approaches. Use them to test your reasoning before turning to the full Catholic moral framework.')}
${box('Three useful lenses',`<div class="grid2"><div class="moral-lens"><b>Consequences</b><p>What good or harm is likely to follow? Outcomes matter, but a good outcome does not automatically justify every means.</p></div><div class="moral-lens"><b>Duties and principles</b><p>What moral obligations must be respected? Are we treating people with dignity rather than using them?</p></div><div class="moral-lens"><b>Virtue and character</b><p>What would an honest, just, compassionate, courageous, and prudent person do?</p></div><div class="moral-lens"><b>How they fit</b><p>A careful Catholic moral judgment considers the moral action, its intended end, circumstances, and a life of virtue under the truth of God.</p></div></div><p class="source">These are simplified descriptions of consequentialist, duty-based, and virtue approaches. They do not claim each approach always reaches one predictable answer.</p>`)}
${box('Use all three',`${field('p2.outcomes','Consequences: What important positive or negative effects might each response have?','For A, consider one likely benefit or risk. Do the same for B.','Avoid claiming you can predict every outcome.',3)}${field('p2.duty','Duty: Which moral principle must not be ignored, regardless of the outcome?','Examples: honesty, human dignity, justice, respect for persons.','Name the principle and explain why it applies.',3)}${field('p2.virtue','Virtue: Which character quality is most needed to act well in this situation? Why?','Examples: prudence, justice, fortitude, temperance, compassion.','Make a specific connection to the case.',3)}${hint('A good ethical analysis does not merely ask “Will it work?” It also asks “Is the action itself right?” and “What kind of person am I becoming?”')}`)}`;
if(n===4)return `${pageHead('Part 2 · Step 5 of 9','One new detail','New information can affect a decision. But does it change the moral principle itself?')}
${box('The case develops',`${scenarioView(s)}<div class="note rose"><strong>New information:</strong> ${esc(s.twist)}</div>${field('p2.changed','Does this new information change your proposed response? Explain what changed and what did not.','You may keep your original choice, revise it, or suggest a better action.','Include the moral principle that remains important.',4)}${hint(esc(s.twistHint))}`)}
${box('A crucial distinction',`<p><strong>An objective moral principle</strong> does not change simply because new facts arrive. <strong>Prudential judgment</strong>, our reasoning about what action best honours that principle in this particular case, may change when we learn more.</p><p>Example: the dignity of a person does not change, but the safest or most responsible way to protect that person might depend on circumstances.</p>`,'softer')}`;
if(n===5)return `${pageHead('Part 2 · Step 6 of 9','Examine the action itself','Catholic moral theology asks us to assess three dimensions of a freely chosen act: what is chosen, why it is chosen, and the circumstances.')}
${box('The Catholic moral action test',`<div class="definition"><b>1. The act</b><span><strong>What am I actually choosing to do?</strong> An action must be morally good in itself, not merely attractive because of the result.</span></div><div class="definition"><b>2. The intention</b><span><strong>Why am I doing it?</strong> Even a good intention does not make a wrongful action good.</span></div><div class="definition"><b>3. Circumstances</b><span><strong>What facts surround this choice?</strong> These can affect consequences and responsibility, but do not turn an inherently wrongful action into a good one.</span></div><div class="note gold"><strong>Central rule:</strong> A good end does not justify an evil means. We cannot decide that harming a person's dignity becomes right simply because we hope for a good result.</div>${cite('Catechism, sources of morality (CCC 1750–1756)',CCC.moral)}`)}
${box('Test your proposed action',`${field('p2.act','What specific action does your group now propose?','Be concrete. Say what the person should actually do.','You may choose A, B, or another responsible course of action.',3)}${field('p2.intention','What good is the person trying to achieve through that action?','Example: protect someone, act justly, tell the truth, repair harm.','Name the purpose clearly.',3)}${field('p2.circumstances','What facts and circumstances matter when deciding how to act?','Consider urgency, safety, who is vulnerable, what evidence is known, and possible harms.','Make sure the act itself respects moral principles.',4)}${hint('Review the three dimensions separately. Asking about the intended good is not the same as deciding whether the chosen means is itself acceptable.')}`)}`;
if(n===6)return `${pageHead('Part 2 · Step 7 of 9','Aquinas and the moral life','We now ask not only which choice to make, but how Catholic teaching says human beings recognize and consistently choose the good.')}
${box('Four connected ideas',`<div class="definition"><b>Natural law</b><span>We are created with reason and can discover basic moral truths grounded ultimately in God's wisdom. Natural law is accessible to believers and nonbelievers.</span></div><div class="definition"><b>Conscience</b><span>Conscience is a judgment of reason applied to a concrete choice. It is not merely a feeling and must be formed through truth, reflection, Scripture, and guidance.</span></div><div class="definition"><b>Virtue</b><span>Virtues such as prudence, justice, fortitude, and temperance are stable habits that help us choose what is good consistently.</span></div><div class="definition"><b>Grace</b><span>God freely offers help that heals and elevates the moral and spiritual life. In Christ, the Holy Spirit strengthens us to love and act as disciples.</span></div><p class="source">See CCC 1954–1960, 1777–1785, 1803–1813, and the Church's teaching on grace.</p>`)}
${box('Apply the four ideas',`${field('p2.natural','Natural law: What basic moral truth can we recognize through reason in this case?','Examples: human dignity, fairness, the need to seek truth, protection of persons.','Explain why that moral good matters regardless of personal preference.',3)}${field('p2.conscience','Conscience: How should a person think carefully before making the choice?','What facts should be checked? What advice or teaching could help form their judgment?','Do not describe conscience as simply “doing what feels right.”',3)}${field('p2.habit','Virtue: Which good habit or virtue would make this action easier to choose consistently?','Name the virtue and how a person could practise it.','Consider prudence when several responsible actions are possible.',3)}${field('p2.grace','Grace: According to Catholic teaching, how can God help a person live the good, especially when it is difficult?','Connect Jesus Christ, prayer, and the Holy Spirit to moral growth.','Explain the teaching; you are not being asked to profess belief.',3)}${hint('Natural law helps us recognize the good; conscience judges this action; virtue shapes our habits; grace helps and elevates us toward God.')}`)}`;
if(n===7)return `${pageHead('Part 2 · Step 8 of 9','Reach a reasoned judgment','You have heard opposing arguments, examined the facts, and applied the Catholic moral framework. Now make a careful decision.')}
${box('Your group’s final response',`${choice('p2.final',[['A','Response A','After discussion, we judge that A is preferable.'],['B','Response B','After discussion, we judge that B is preferable.'],['other','A third response','We can propose a clearer or better action.']])}${field('p2.finalWhy','What should be done, and why? Explain your final judgment using at least two Catholic moral concepts.','Name the actual action, then explain with natural law, conscience, virtue, moral action, or dignity.','Aim for 4–6 clear sentences.',6)}${field('p2.reconsider','How did your thinking develop since your first response?','Explain whether your view changed, or why it became stronger.','This is about reasons and learning, not whether you adopted a religious belief.',3)}`)}
${box('Check the strength of your explanation',`<div class="worksheet"><p>Before moving on, read the final response aloud. Does it:</p><ul class="list-clear"><li>Identify a <strong>specific action</strong>, not just a vague value?</li><li>Explain <strong>why</strong> that choice protects what is good?</li><li>Use <strong>at least two</strong> Catholic moral concepts accurately?</li><li>Show why a good goal does not justify an evil method?</li><li>Treat those affected as persons with dignity?</li></ul></div><p class="mini" style="margin-top:14px"><strong>Remember:</strong> ${esc(s.avoid)}</p>`,'softer')}`;
if(n===8)return `${pageHead('Part 2 · Step 9 of 9','What Catholics believe','Bring the full inquiry together. This is the theological explanation that connects Lessons 1.11 and 1.12.')}
${box('The Catholic understanding',`<div class="closing"><span class="eyebrow">OUR THEOLOGICAL SYNTHESIS</span><p class="pull">Catholics believe that God is the ultimate source of goodness.</p><p>Because human beings are created in God's image and likeness, we have the ability to recognize what is good through reason. St. Thomas Aquinas calls this <strong>natural law</strong>. It means that moral truth is not simply invented by individuals or societies. We are called to <strong>discover</strong> it.</p><p>However, our understanding can be mistaken. This is why we must <strong>form our conscience</strong>, use reason, and develop virtue. Through Jesus Christ and the grace of the Holy Spirit, God also helps us grow in goodness and live according to His love.</p><div class="short-divider"></div><p><strong>Natural law</strong> explains how we can recognize the good. <strong>Conscience</strong> helps us judge what to do. <strong>Virtue</strong> helps us consistently choose the good. <strong>Grace</strong> perfects our moral and spiritual life, leading us toward God, the ultimate Good.</p></div><p class="source">Clarification: in Aquinas's teaching, natural law is our participation in God's eternal law, discernible through reason; it is more than the ability to reason by itself.</p>`)}
${box('The whole idea in four parts',`<div class="summarystrip"><div class="summarychip"><b>01 · Natural law</b><span>Recognize the good through reason</span></div><div class="summarychip"><b>02 · Conscience</b><span>Judge what we should do</span></div><div class="summarychip"><b>03 · Virtue</b><span>Practise choosing good consistently</span></div><div class="summarychip"><b>04 · Grace</b><span>Receive God's help to grow in goodness</span></div></div>${field('p2.wrap','Final reflection: In Catholic teaching, if God is the ultimate source of goodness, why do our own choices and reasoning still matter?','Connect at least two of the four ideas above.','Answer in 2–4 sentences. You are explaining what Catholics believe.',4)}`)}
${box('Return to the question that started everything',`<div class="callout-question">“Compared to what?”</div><p>When Catholics make a moral judgment, the ultimate measure is not individual preference, the majority, or what happens to be legal. The ultimate measure is the good grounded in God. But human beings must still seek that good honestly, form conscience carefully, and freely choose actions that respect truth and human dignity.</p><p>Being able to describe this reasoning accurately is the learning goal. It does not require you to adopt the belief personally.</p><div class="flex no-print" style="margin-top:20px"><button class="btn" data-action="export">Download completed responses ↗</button><button class="btn alt" data-action="print">Print / Save as PDF</button></div>${cite('Natural moral law (CCC 1954–1960)',CCC.natural)}${cite('Conscience and its formation (CCC 1777–1785)',CCC.formation)}${cite('Human and theological virtues (CCC 1803–1813)',CCC.virtue)}`,'warm')}`;
return '';
}
const RESPONSE_LABELS={
'p1.diff':'Distinguish a preference from a moral judgment','p1.approval':'Can approval make something right?','p1.approvalWhy':'Explain the standard of judgment','p1.unjustLaw':'Why can a legal law be unjust?','p1.recognize':'How can injustice be recognized?','p1.source':'Catholic teaching: invented or discovered?','p1.nonbeliever':'Can a nonbeliever recognize moral truths?','p1.wallet':'Lost wallet: moral principle and action','p1.bridge':'Why might a person choose wrongly?',
'p2.scenarioId':'Chosen case','p2.initial':'Initial response','p2.initialReason':'Initial reason','p2.argA':'Team A: strongest argument','p2.argB':'Team B: strongest argument','p2.challenge':'Strongest objection to each','p2.outcomes':'Consequences','p2.duty':'Moral duty','p2.virtue':'Virtue needed','p2.changed':'Does new information change action?','p2.act':'The act chosen','p2.intention':'The intended good','p2.circumstances':'Relevant circumstances','p2.natural':'Natural law','p2.conscience':'Conscience formation','p2.habit':'Virtue and habit','p2.grace':'Grace and the Holy Spirit','p2.final':'Final response','p2.finalWhy':'Final moral judgment and reasons','p2.reconsider':'How thinking developed','p2.wrap':'Final theological reflection'};
function humanAnswer(key,v){if(key==='p2.scenarioId')return SCENARIOS.find(s=>s.id===v)?.title||v;if(['p2.initial','p2.final'].includes(key))return v==='A'?'Response A':v==='B'?'Response B':'A different response';if(key==='p1.approval')return {yes:'Yes',no:'No',depends:'Needs more information'}[v]||v;if(key==='p1.source')return {invented:'Invented by individuals or cultures',discovered:'Discovered through reason with God as ultimate source',majority:'Decided by a majority'}[v]||v;return v;}
function allEntries(prefix){return Object.entries(RESPONSE_LABELS).filter(([k])=>k.startsWith(prefix+'.'));}
function dateStamp(){const now=new Date();const parts=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')];return parts.join('-');}
function reportText(){let l=[];l.push('THE MORAL CROSSROADS','HRE4M | Objective Moral Truth, Conscience, Morality and Ethics','Completed work | '+new Date().toLocaleString(),'');l.push('GROUP / STUDENT DETAILS');l.push('Period: '+(get('profile.period')||'Not provided'));l.push('Students / initials: '+(state.profile.members.filter(Boolean).join(', ')||'Not provided'));l.push('');for(let p of ['p1','p2']){l.push('='.repeat(55),p==='p1'?'PART 1: COMPARED TO WHAT?':'PART 2: THE MORAL CROSSROADS','='.repeat(55));if(p==='p2'&&get('p2.scenarioId')){const s=scenario();l.push('Scenario: '+s.title,'The situation: '+s.setup,'Response A: '+s.a,'Response B: '+s.b,'New information: '+s.twist,'');}for(let [k,title] of allEntries(p)){if(p==='p2'&&k==='p2.scenarioId')continue;const v=get(k);l.push(title.toUpperCase());l.push(isFilled(v)?humanAnswer(k,v):'[No response yet]');l.push('');}}
l.push('KEY CATHOLIC SYNTHESIS');l.push('Natural law explains how we can recognize the good. Conscience helps us judge what to do. Virtue helps us consistently choose the good. Grace perfects our moral and spiritual life, leading us toward God, the ultimate Good.');l.push('');l.push('Sources: Catechism of the Catholic Church 1750–1756; 1777–1785; 1803–1813; 1954–1960.');l.push('This text is a record of student responses, not a claim that personal religious assent is required.');return l.join('\n');}

function report(){const profile=state.profile.members.filter(Boolean).map(esc).join(', ')||'Not provided';const reports=['p1','p2'].map(p=>{let content=allEntries(p).filter(([k])=>!(p==='p2'&&k==='p2.scenarioId')).map(([k,label])=>`<div class="report-answer"><h3>${esc(label)}</h3><p>${esc(isFilled(get(k))?humanAnswer(k,get(k)):'[No response yet]')}</p></div>`).join('');return `<div class="sheet-print"><div class="eyebrow">${p==='p1'?'Part 1 · Compared to what?':'Part 2 · The Moral Crossroads'}</div>${p==='p2'&&get('p2.scenarioId')?`<h2>${esc(scenario().title)}</h2><p class="small">${esc(scenario().setup)}</p>`:''}${content}</div>`;}).join('');return `<main class="main" style="padding-top:36px;padding-bottom:50px"><div class="no-print"><button class="btn alt sm" data-action="back-to-work">← Back to activity</button> <button class="btn sm" data-action="print-now">Print / Save as PDF</button> <button class="btn sm alt" data-action="export">Download TXT</button></div><h1 style="font-size:42px;margin:28px 0 7px">The Moral Crossroads</h1><p class="muted">Student response report · HRE4M · ${new Date().toLocaleDateString()}</p><p><strong>Period:</strong> ${esc(get('profile.period')||'Not provided')} &nbsp;&nbsp; <strong>Group:</strong> ${profile}</p><hr style="border:none;border-top:1px solid #ddd;margin:25px 0">${reports}</main>`;}
function teacher(){return `<main class="main" style="padding-top:40px;padding-bottom:55px"><button class="btn alt sm no-print" data-action="back-to-work">← Back to student activity</button><div class="pagehead" style="margin-top:20px"><span class="tag">FACILITATOR MATERIAL · HRE4M</span><h1 style="font-size:clamp(35px,5vw,52px)">Teacher guide</h1><p>Two connected activities that bridge Lesson 1.11, Objective Moral Truth, and Lesson 1.12, Conscience, Morality, and Ethics.</p></div><div class="teacher-box"><h3>Purpose and theological throughline</h3><p>Students examine what gives a moral judgment its authority, recognize that legal approval and social consensus can be mistaken, and learn the Catholic claim that objective goodness is ultimately grounded in God. After Lesson 1.12, they move from the <em>source</em> of moral truth to the human task of <em>recognizing and choosing</em> the good.</p><p>Natural law is our participation in God's eternal law discerned by reason (CCC 1954–1960). Conscience is a judgment of reason applied to a specific act (CCC 1778) and requires formation (CCC 1783–1785). Virtue creates good habits (CCC 1803–1804), while grace heals and elevates moral life in Christ.</p><div class="note"><strong>Instructional stance:</strong> Teach and accurately represent Catholic doctrine with confidence. Students are assessed on theological understanding and quality of reasoning, not on personally professing the faith.</div></div><div class="grid2"><div class="teacher-box"><h3>Part 1 · 15–20 minutes</h3><ol class="list-clear"><li><strong>3 minutes:</strong> Preference versus moral claim.</li><li><strong>4 minutes:</strong> Popularity versus moral rightness.</li><li><strong>4 minutes:</strong> Historical unjust law and moral judgment.</li><li><strong>5 minutes:</strong> Catholic measure of goodness and natural law.</li><li><strong>3 minutes:</strong> Lost wallet and the transition to conscience.</li></ol><p class="small muted">Works individually or in pairs. A short class debrief can follow.</p></div><div class="teacher-box"><h3>Part 2 · 45–60 minutes</h3><ol class="list-clear"><li><strong>5 minutes:</strong> Form groups and assign scenario.</li><li><strong>5 minutes:</strong> Initial moral position.</li><li><strong>8 minutes:</strong> Opposing-position dialogue.</li><li><strong>5 minutes:</strong> Compare ethical frameworks.</li><li><strong>5 minutes:</strong> New fact and reconsideration.</li><li><strong>8 minutes:</strong> Object, intention, circumstances and Aquinas.</li><li><strong>7 minutes:</strong> Conclude and explain Catholic synthesis.</li></ol><p class="small muted">Adapt the timings to your 75-minute lesson. Four-person groups are ideal; smaller groups can take both sides.</p></div></div><div class="teacher-box"><h3>Six group scenarios</h3><div class="grid2">${SCENARIOS.map(s=>`<div class="moral-lens"><b>${esc(s.title)}</b><p>${esc(s.category)}</p><p style="margin-top:10px">${esc(s.tension)}</p></div>`).join('')}</div><p class="small" style="margin-top:15px">Use the case selector on the first Part 2 page to distribute different cases across the room. Students can choose or use the random-case option.</p></div><div class="teacher-box"><h3>What to listen for as students reason</h3><ul class="list-clear"><li>They distinguish an objective moral claim from their own preference or a group's approval.</li><li>They explain the Catholic claim that God is the ultimate source of goodness, without presenting examples of injustice as proof of God's existence.</li><li>They recognize that nonbelievers can use reason to discover moral truths in Aquinas's natural-law framework.</li><li>They distinguish natural law, conscience, virtue, and grace rather than using them as synonyms.</li><li>They assess what is actually chosen, why it is chosen, and relevant circumstances. A good end does not justify evil means.</li><li>They distinguish disagreement about an objective principle from disagreement about a prudent practical application.</li><li>They respond to a classmate's argument rather than attacking the classmate's beliefs.</li></ul></div><div class="teacher-box"><h3>Debrief prompts for the Smartboard</h3><ol class="list-clear"><li>What is the difference between a moral standard and our judgment of it?</li><li>How can two groups agree that human dignity matters but choose different responsible actions?</li><li>Can a person's conscience be sincerely mistaken? According to the Church, how should conscience be formed?</li><li>Why does Catholic teaching say freedom and reason are necessary for moral responsibility?</li><li>Why does Aquinas distinguish good habits (virtue) from the gift of God's help (grace)?</li><li>Return to the original question: “Compared to what?” How would a Catholic explain the ultimate standard?</li></ol></div><div class="teacher-box"><h3>Sources and accuracy</h3><p>The app is built around the topics in the Unit 1 Resource Pack for Lessons 1.11 and 1.12, with Catechism references checked against the official Vatican text. Biblical references for follow-up reading include Genesis 1:26–27, Romans 2:14–15, Matthew 22:37–40, and Galatians 5:22–23. Use your classroom NRSV-CE Bible for any full Scripture readings.</p><ul class="list-clear"><li><a href="${CCC.natural}" target="_blank" rel="noopener">CCC 1954–1960 · Natural moral law</a></li><li><a href="${CCC.conscience}" target="_blank" rel="noopener">CCC 1777–1778 · Judgment of conscience</a></li><li><a href="${CCC.formation}" target="_blank" rel="noopener">CCC 1783–1785 · Formation of conscience</a></li><li><a href="${CCC.moral}" target="_blank" rel="noopener">CCC 1750–1756 · Sources of morality</a></li><li><a href="${CCC.virtue}" target="_blank" rel="noopener">CCC 1803–1806 · Human virtues</a></li><li><a href="${CCC.faith}" target="_blank" rel="noopener">CCC 1812–1813 · Theological virtues</a></li></ul><p class="small muted">External references require connectivity, but no external reference is needed to complete the activity.</p></div><div class="teacher-box"><h3>Using the file on school devices</h3><p>Open the HTML file directly in a modern browser on Windows, Chromebook, or another computer. There are no libraries, logins, fonts, images, or scripts loaded from the internet. Autosaving uses this browser's local storage if allowed. If a school browser restricts file storage or devices are shared, use <strong>Export</strong> before closing. The plain-text export can be uploaded to your LMS, and the backup JSON can restore answers later.</p><div class="flex no-print"><button class="btn" data-action="go-p1">Preview Part 1</button><button class="btn alt" data-action="go-p2">Preview Part 2</button><button class="btn cream" data-action="backup">Download JSON backup</button></div></div></main>`;}

root.addEventListener('input',e=>{const t=e.target;if(!t?.dataset?.bind)return;if(t.type==='radio'||t.tagName==='SELECT')return;put(t.dataset.bind,t.value);});
root.addEventListener('change',e=>{const t=e.target;if(t?.dataset?.bind){if(t.type==='radio'&&!t.checked)return;put(t.dataset.bind,t.value);if(t.dataset.bind==='p2.scenarioId')render();}if(t.id==='import-json'){const file=t.files?.[0];if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(!obj||typeof obj!=='object'||!obj.p1||!obj.p2||!obj.profile)throw new Error('Missing activity data');if(!window.confirm('Replace the answers currently on this device with the imported backup?'))return;state={...fresh(),...obj,profile:{...fresh().profile,...obj.profile,members:Array.isArray(obj.profile.members)?obj.profile.members.slice(0,4):['','','','']},p1:{...obj.p1},p2:{scenarioId:'',...obj.p2}};persist();navigate('home');showToast('Your backup has been restored.');}catch(err){showToast('Unable to open this file. Select a JSON backup exported by this activity.');}};reader.readAsText(file);}});
root.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t)return;const a=t.dataset.action;if(a==='home'){navigate('home');return;}if(a==='go-p1'||a==='go-p2'){startPart(a==='go-p1'?'p1':'p2');return;}if(a.startsWith('step-')){setStep(+a.slice(5));return;}if(a==='next'){nextStep();return;}if(a==='prev'){setStep(step-1);return;}if(a==='finish'){if(unfinished(step))showToast('You can return to complete the final reflection at any time.');navigate('home');return;}if(a==='teacher'){if(route==='work')lastWork={part,step};navigate('teacher');return;}if(a==='back-to-work'){navigate('work',lastWork.part,lastWork.step);return;}if(a==='export'){exportAnswers();return;}if(a==='backup'){exportBackup();return;}if(a==='print'){if(route==='work')lastWork={part,step};navigate('report');showToast('A printable response report is ready. Choose “Print / Save as PDF.”');return;}if(a==='print-now'){window.print();return;}if(a==='import-start'){document.querySelector('#import-json')?.click();return;}if(a==='random-case'){const ids=SCENARIOS.map(s=>s.id);const arr=ids.filter(id=>id!==get('p2.scenarioId'));const selected=arr[Math.floor(Math.random()*arr.length)]||ids[0];put('p2.scenarioId',selected);render();showToast('Scenario assigned: '+scenario().title);return;}if(a==='reset'){if(!window.confirm('Start a new group? This clears locally saved responses on this device. Export any work you want to keep first.'))return;state=fresh();persist();navigate('home');showToast('New group ready.');return;}});
render();
})();
</script>
</body>
