<script>const PASSAGES=[
{id:'jacob',title:"Jacob's dream",ref:'Genesis 28:10–17',genre:'Dream narrative',scene:'On a journey, Jacob dreams of a stairway between earth and heaven and hears God promise presence and blessing.',notice:'Notice the stairway, the promise, and Jacob’s response when he wakes.',bridge:'John 1:51',teacher:{literal:'Jacob dreams, hears God renew the family promise, and recognizes the place as holy (vv. 12–17).',allegorical:'John 1:51 reuses the image of angels ascending and descending, now in relation to the Son of Man. A Christian reading sees Jesus as the decisive meeting of heaven and earth.',moral:'Jacob’s surprise invites attentiveness to God’s presence even in an unfamiliar place; name a concrete practice rather than claiming every dream is a message.',anagogical:'The opened heaven can direct hope toward lasting communion with God.',caution:'Keep Jacob’s own covenant story and journey in view before making a Christ connection.'}},
{id:'manna',title:'Bread in the wilderness',ref:'Exodus 16:11–18',genre:'Wilderness narrative',scene:'The Israelites receive quail and manna in the wilderness. They gather portions for their households.',notice:'Notice who provides the food and what happens when people measure their portions.',bridge:'John 6:32–35',teacher:{literal:'God answers hunger with quail and manna; the people gather, and the measured amounts leave each with enough (vv. 13–18).',allegorical:'John 6:32–35 contrasts wilderness manna with the true bread from heaven, Jesus. Do not erase the first story’s concern for daily provision.',moral:'Trust and concern that everyone has enough can shape a specific response to scarcity.',anagogical:'The true bread of life can point beyond temporary food toward life with God.',caution:'Do not claim Exodus 16 itself explicitly describes the Eucharist; name the later Christian connection.'}},
{id:'serpent',title:'The lifted sign',ref:'Numbers 21:4–9',genre:'Wilderness narrative',scene:'After complaint and danger in the wilderness, the people ask Moses for help. A raised bronze serpent becomes a sign through which they live.',notice:'Notice the complaint, confession, raised sign, and response.',bridge:'John 3:14–15',teacher:{literal:'The people speak against God and Moses; after serpents bring death, they ask for prayer and look at the raised sign (vv. 4–9).',allegorical:'Jesus explicitly compares his being lifted up with Moses’ raised serpent in John 3:14–15.',moral:'Admitting wrong and turning toward help can be a specific moral response.',anagogical:'John 3:15 links Christ’s saving work with eternal life.',caution:'The bronze object is not an independent magical cure; attend to the story’s relationship with God.'}},
{id:'ruth',title:'Ruth stays with Naomi',ref:'Ruth 1:15–18',genre:'Family narrative',scene:'Ruth refuses to abandon Naomi and commits herself to Naomi’s people and God.',notice:'Notice Ruth’s promises and Naomi’s response.',bridge:'Matthew 1:5',teacher:{literal:'Ruth pledges to travel and live with Naomi and to share her people and God (vv. 16–17).',allegorical:'Matthew 1:5 places Ruth in Jesus’ ancestry. In the whole biblical story, her inclusion can suggest the reach of God’s saving plan beyond one people.',moral:'Loyal accompaniment can become a concrete act of care when someone is isolated.',anagogical:'Her welcome into a new people can invite a careful reflection on the gathering of all peoples with God.',caution:'Do not turn each person into a one-to-one symbol; keep Ruth’s real loyalty and the story’s context first.'}},
{id:'branch',title:'A just ruler and a peaceful world',ref:'Isaiah 11:1–9',genre:'Prophetic poetry',scene:'Isaiah pictures a ruler from Jesse’s line, guided by God’s Spirit, who judges justly. Peace fills the vision.',notice:'Notice the ruler’s treatment of the poor and the imagery of peace.',bridge:'Romans 15:12',teacher:{literal:'A poetic vision describes a Spirit-filled ruler from Jesse’s line and an order marked by justice and peace (vv. 1–9).',allegorical:'Romans 15:12 cites the root of Jesse in relation to the hope of the nations; Christians read the royal promise in light of Christ.',moral:'Fairness toward people with little power is a concrete response to the passage’s concern for justice.',anagogical:'The peaceable vision can direct hope toward God’s final renewal of creation.',caution:'The animal images are prophetic poetry; do not flatten them into a news report.'}},
{id:'covenant',title:'A new covenant',ref:'Jeremiah 31:31–34',genre:'Prophetic promise',scene:'God promises a new covenant with Israel and Judah, with the law written on hearts and sins forgiven.',notice:'Notice to whom the promise is first addressed and what God says will change.',bridge:'Luke 22:20',teacher:{literal:'Jeremiah announces a future covenant for Israel and Judah marked by inner knowledge of God and forgiveness (vv. 31–34).',allegorical:'At the Last Supper, Jesus calls the cup the new covenant in his blood (Luke 22:20).',moral:'Forgiveness and living God’s law from the heart can inform one specific choice.',anagogical:'The promise of knowing God can point toward complete communion with God.',caution:'Do not suggest God discarded Israel; the text names Israel and Judah as the first hearers.'}},
{id:'bones',title:'The valley of dry bones',ref:'Ezekiel 37:1–14',genre:'Prophetic vision',scene:'Ezekiel sees dry bones come together and receive breath. God explains the vision to a people who say their hope is gone.',notice:'Read God’s explanation in verses 11–14 before deciding what the vision means.',bridge:'1 Corinthians 15:20–22',teacher:{literal:'The vision dramatizes God’s promise to restore a despairing, exiled people; verses 11–14 explain the symbol.',allegorical:'In light of Christ’s resurrection, Christians can see a wider hope for life beyond death, while preserving the vision’s first meaning for Israel.',moral:'A practical response is to support someone whose hope is exhausted, without pretending suffering is easy.',anagogical:'Christ’s resurrection gives a ground for hope in the final raising of the dead (1 Corinthians 15:20–22).',caution:'Do not treat the bones as a video recording of a mass resurrection; this is a vision with an explanation.'}},
{id:'jonah',title:'Jonah prays from the deep',ref:'Jonah 1:17–2:10',genre:'Narrative and prayer',scene:'Jonah is swallowed by a great fish, prays from distress, and is brought back to dry land.',notice:'Notice the change between Jonah’s danger, prayer, and deliverance.',bridge:'Matthew 12:40',teacher:{literal:'The story places Jonah in a fish; his prayer describes distress and deliverance, and the fish releases him (1:17; 2:1–10).',allegorical:'Jesus uses Jonah’s time in the fish as a sign related to his own death and resurrection (Matthew 12:40).',moral:'Prayer and turning toward God in trouble can be a response, while remembering that the story does not promise instant rescue from every danger.',anagogical:'The movement from the depths to life can direct hope toward resurrection through Christ.',caution:'Notice the prayer’s poetic language; do not confuse its imagery with a travel log.'}},
{id:'cross',title:'Remember me',ref:'Luke 23:39–43',genre:'Passion narrative',scene:'While Jesus is crucified, one criminal turns to him and asks to be remembered. Jesus responds with a promise of paradise.',notice:'Notice the contrast between the two speakers and Jesus’ reply.',bridge:'Revelation 21:3–4',teacher:{literal:'One criminal mocks Jesus; the other admits guilt and asks Jesus to remember him; Jesus promises paradise (vv. 39–43).',allegorical:'The scene reveals Christ’s saving mercy at the cross. Explain how the event fits the Christian story of salvation rather than inventing a hidden symbol.',moral:'A concrete response is to recognize wrongdoing and offer mercy rather than decide someone is beyond hope.',anagogical:'Jesus’ promise directs attention explicitly to life with him beyond death.',caution:'Do not turn this one scene into a claim that choices and justice never matter.'}},
{id:'cana',title:'A wedding at Cana',ref:'John 2:1–11',genre:'Gospel sign story',scene:'At a wedding, Jesus turns water into wine after his mother notices a need. The sign reveals his glory.',notice:'Notice the jars, Mary’s direction to the servants, and the disciples’ response.',bridge:'Revelation 19:7–9',teacher:{literal:'At a wedding feast, Jesus directs servants to fill water jars; the water becomes wine, and the disciples believe (vv. 1–11).',allegorical:'John calls this a sign that reveals Jesus’ glory. Christian readers can see the generous gift as a sign of new life in Christ.',moral:'Mary’s instruction to listen to Jesus and the servants’ faithful action can suggest attentive service in a real need.',anagogical:'The wedding feast can invite a careful connection to the final joy of the Lamb’s banquet (Revelation 19:7–9).',caution:'Do not say the passage explicitly describes Heaven or reduce it to a lesson about beverages.'}}
];

const APP_ID='hre4m-u2-2-four-senses', STORAGE_KEY=APP_ID+'-v1';
const PASSAGE_GUIDANCE = {
  jacob: {
    allegorical: {
      reference: 'John 1:51',
      find: 'In Genesis 28:12, mark what the angels do. Find the same action in John.',
      connect: 'Identify where the angels are moving in Genesis and who is at the centre of the image in John. What might that change suggest about Jesus?'
    },
    moral: {

    },
    anagogical: {
      find: 'List two things God promises in verse 15. Pick one that could help you picture a hope beyond the end of Jacob’s trip.',
      connect: 'If that part of the promise were fulfilled completely, what would life with God be like? Explain how the verse led you there.'

  },
  manna: {
    allegorical: {
      reference: 'John 6:32–35',
      find: 'Mark who provides food in Exodus 16:12–15. Then look for the giver and the gift in John.',
      connect: 'Where does Jesus place himself in the comparison? Explain what the wilderness story helps you understand about him.'
    },
    moral: {
      find: 'Read Exodus 16:16–18. Look at what each person is told to gather and what happens when it is measured.',

    },
    anagogical: {
      reference: 'John 6:49–51',
      find: 'Compare what happened to the people who ate manna with what Jesus promises in John. Mark the words that tell you how long each gift sustains life.',
      connect: 'What kind of life with God does that comparison open up? Describe it in your own words.'
    }
  },
  serpent: {
    allegorical: {
      reference: 'John 3:14–15',
      find: 'Read Numbers 21:8–9 and John together. Identify what or who is lifted up in each passage.',
      connect: 'Compare how people respond and what follows. Use that pattern to explain why Jesus brings up Moses’ story.'
    },
    moral: {
      find: 'In Numbers 21:7, identify what the people say and what they ask Moses to do.',
      connect: 'Imagine someone realizes they have caused harm in a group. Choose one first step they could take and connect it to the sequence you noticed.'
    },
    anagogical: {
      reference: 'John 3:14–15',
      find: 'Read the ending of Numbers 21:9 and then the end of John 3:15. Notice the words each uses for the life being offered.',
      connect: 'What hope does John describe beyond surviving a danger? Explain how the comparison helps you see the difference.'
    }
  },
  ruth: {
    allegorical: {
      reference: 'Matthew 1:1–5',
      find: 'Notice what Ruth commits herself to in Ruth 1:16. In Matthew, read whose family line is being traced and find Ruth’s name.',
      connect: 'Ruth comes from Moab. Why might her presence in this family line matter for the story of Jesus and God’s saving plan?'
    },
    moral: {
      find: 'Choose one part of Ruth’s commitment in verses 16–17. What does it ask of her in that moment?',
      connect: 'Think of a person facing a difficult change. Describe one action that would put the same kind of commitment into practice and explain how.'
    },
    anagogical: {
      reference: 'Revelation 7:9–10',
      find: 'Find what Ruth says about belonging in Ruth 1:16. Then look at where the worshippers in Revelation come from.',
      connect: 'How could the picture in Revelation help you imagine belonging with God on a larger scale? Explain the link to Ruth’s words.'
    }
  },
  branch: {
    allegorical: {
      reference: 'Romans 15:12',
      find: 'Find Jesse’s name in both readings. In Isaiah 11:2–4, pick one quality or action of the promised ruler.',
      connect: 'Notice who looks to that ruler in Romans. What does the quality you chose help Christians understand about Christ’s kingship?'
    },
    moral: {
      find: 'In Isaiah 11:3–4, compare how the ruler judges with what someone could decide by appearances alone.',
      connect: 'Think of a decision at school where someone could be overlooked. What would you do before deciding, based on the ruler’s example?'
    },
    anagogical: {
      find: 'Choose one image from Isaiah 11:6–9. Describe what is different about the world in that image.',
      connect: 'What might that picture help us hope for when God’s work in creation is complete? Use the image to support your idea.'
    }
  },
  covenant: {
    allegorical: {
      reference: 'Luke 22:20',
      find: 'Read Jeremiah 31:31–34 and identify who receives the promise. Then find the phrase Jesus repeats over the cup in Luke.',
      connect: 'What does Jesus connect that phrase to at the meal? Explain what the link adds to a Christian reading of the promise.'
    },
    moral: {
      find: 'Find where God says the law will be written in Jeremiah 31:33. Think about how that image might shape a decision.',
      connect: 'Choose a moment when nobody is checking what you do. What choice could show that you have taken God’s teaching to heart?'
    },
    anagogical: {
      find: 'In Jeremiah 31:34, look at what everyone will know and what God says about their sins.',
      connect: 'Choose one of those promises. What would the completed relationship between God and the people be like if that promise were fully realized?'
    }
  },
  bones: {
    allegorical: {
      reference: '1 Corinthians 15:20–22',
      find: 'Use Ezekiel 37:11–14 to identify who the bones represent. Then find what Paul says has happened to Christ.',
      connect: 'Trace the movement from the starting situation to what God does in each reading. What makes the vision a fitting image to read alongside Christ’s story?'
    },
    moral: {
      find: 'Compare what the people say about themselves in Ezekiel 37:11 with what God says he will do in verses 12–14.',
      connect: 'Think of a person who feels defeated after a setback. What is one realistic thing you could do alongside them that follows from the change you noticed?'
    },
    anagogical: {
      reference: '1 Corinthians 15:20–23',
      find: 'In Paul’s description, mark what happens first and who is mentioned next. Keep Ezekiel’s image of life returning in view.',
      connect: 'What future does Paul invite people who belong to Christ to hope for? Explain how the image from Ezekiel helps you picture it.'
    }
  },
  jonah: {
    allegorical: {
      reference: 'Matthew 12:40',
      find: 'Compare Jonah 1:17 with Jesus’ words in Matthew. Identify the time detail that appears in both.',
      connect: 'What experience of the Son of Man is Jesus asking his hearers to connect with Jonah’s experience? Explain the parallel in your own words.'
    },
    moral: {
      find: 'In Jonah 2:1–3, notice what Jonah does while he is still in distress. Find a phrase from his prayer that stands out to you.',
      connect: 'Imagine an ordinary situation where you feel stuck. What first step could you take that reflects the part of Jonah’s prayer you chose?'
    },
    anagogical: {
      find: 'Trace where Jonah is at the beginning and where he ends up. Recall the connection you made to Jesus’ story in the allegorical step.',
      connect: 'Use that connection to consider what hope people have in the face of death. How does that hope reach beyond Jonah’s return to land?'
    }
  },
  cross: {
    allegorical: {
      find: 'Compare what the two men ask of Jesus in Luke 23:39 and 42. Then look at how Jesus replies in verse 43.',
      connect: 'What does Jesus’ reply reveal about the kind of saving work he can do, even while he is on the cross?'
    },
    moral: {
      find: 'Look at what the second man admits in verses 40–42 and how Jesus responds in verse 43.',
      connect: 'Choose either the man’s honesty or Jesus’ response as your starting point. What could you say or do in a situation where someone has caused harm?'
    },
    anagogical: {
      reference: 'Revelation 21:3–4',
      find: 'In Luke 23:43, identify who Jesus says the man will be with. In Revelation, look for who dwells with the people and what changes for them.',
      connect: 'Use one detail from each reading to describe the future hope they help you picture.'
    }
  },
  cana: {
    allegorical: {
      find: 'Follow what happens to the water in John 2:7–10. Then find what John says the sign reveals in verse 11.',
      connect: 'Choose a detail about what Jesus gives or how people respond. Explain what that detail helps you understand about Jesus and the life he offers.'
    },
    moral: {
      find: 'Look at what Mary notices in John 2:3–5 and how the servants respond in verses 7–8. Choose one of their actions.',
      connect: 'Picture an everyday situation where something has gone wrong. What could you do that follows the example you chose?'
    },
    anagogical: {
      reference: 'Revelation 19:7–9',
      find: 'Name the kind of celebration in John 2. In Revelation, find whose celebration it is and notice what the guests are invited to do.',
      connect: 'What future with God might the celebration help us picture? Explain why a wedding feast is a fitting image for the hope you describe.'
    }
  }
};

const SENSES=[
 {key:'literal',name:'Literal',time:'3 min',tag:'Start with the text',question:'What does this passage communicate in its own setting and genre?',why:'Use one detail and its verse number to explain the passage’s meaning in your own words.',placeholder:'The passage shows ___. I see this in verse ___ when ___.'},
 {key:'allegorical',name:'Allegorical',time:'3 min',tag:'Read in light of Christ',question:'How can this passage connect to Christ, the Church, or God’s saving plan?',why:'Explain how a detail in the passage supports your connection. If you use two readings, name a detail from each.',placeholder:'I noticed ___ in verse ___. This connects to Christ or God’s saving work because ___.'},
 {key:'moral',name:'Moral',time:'3 min',tag:'Choose a response',question:'What concrete way of living does this passage invite?',why:'Name one action a person could take today and explain which part of the passage led you to it.',placeholder:'In this situation, I could ___. That follows from verse ___ because ___.'},
 {key:'anagogical',name:'Anagogical',time:'2 min',tag:'Look toward our destiny',question:'What hope about life with God or the final fulfilment of God’s plan does this suggest?',why:'Describe a lasting hope with God. Show which image, promise, or event supports your reading.',placeholder:'The detail ___ helps me picture ___ when God’s plan is fulfilled.'}
];
const CHECKS=[
 ['literal','My literal answer describes the passage’s own meaning and names a detail.'],
 ['allegorical','My Christ or faith connection grows from the text or a linked passage.'],
 ['moral','My moral answer names a specific response today.'],
 ['anagogical','My final answer concerns lasting life with God, not only today’s action.']
];
const $=q=>document.querySelector(q);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const passage=id=>PASSAGES.find(p=>p.id===id);
const reading=ref=>'https://www.biblegateway.com/passage/?search='+encodeURIComponent(ref.replace(/–/g,'-'))+'&version=NRSVCE';
const notes=p=>'https://bible.usccb.org/bible/'+({'jacob':'genesis/28','manna':'exodus/16','serpent':'numbers/21','ruth':'ruth/1','branch':'isaiah/11','covenant':'jeremiah/31','bones':'ezekiel/37','jonah':'jonah/2','cross':'luke/23','cana':'john/2'}[p.id]);
const link=(url,label)=>`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(label)} <span aria-hidden="true">↗</span><span class="visuallyhidden"> (opens a new tab)</span></a>`;
let state={appId:APP_ID,version:1,view:'choose',selected:'',names:'',works:{}};
let storageOK=true,teacherUnlocked=false,toastTimer;
function validate(raw){
 if(!raw||raw.appId!==APP_ID||raw.version!==1||!raw.works||typeof raw.works!=='object'||Array.isArray(raw.works))throw Error('This is not a Four Senses in Practice backup.');
 const clean={appId:APP_ID,version:1,view:['choose','work','guide','teacher'].includes(raw.view)?raw.view:'choose',selected:passage(raw.selected)?raw.selected:'',names:typeof raw.names==='string'?raw.names.slice(0,150):'',works:{}};
 for(const p of PASSAGES){const w=raw.works[p.id];if(!w||typeof w!=='object'||Array.isArray(w))continue;const answers={},checks={};for(const s of SENSES)answers[s.key]=typeof w.answers?.[s.key]==='string'?w.answers[s.key].slice(0,6000):'';for(const [key] of CHECKS)checks[key]=w.checks?.[key]===true;clean.works[p.id]={answers,checks,updatedAt:typeof w.updatedAt==='string'?w.updatedAt:null};}
 if(clean.view==='work'&&!clean.selected)clean.view='choose';
 return clean;
}
try{const saved=localStorage.getItem(STORAGE_KEY);if(saved)state=validate(JSON.parse(saved));}catch(e){storageOK=false;}
function work(p=passage(state.selected)){if(!p)return null;if(!state.works[p.id])state.works[p.id]={answers:{},checks:{},updatedAt:null};return state.works[p.id];}
function count(w=work()){return w?SENSES.filter(s=>(w.answers[s.key]||'').trim()).length:0;}
function save(touch=false){if(touch&&work())work().updatedAt=new Date().toISOString();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state));storageOK=true;}catch(e){storageOK=false;}updateStatus();}
function toast(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4000);}
function nav(view){state.view=view;save();render(true);}
function select(id){if(!passage(id))return;state.selected=id;state.view='work';work();save();render(true);}
function route(){return`<div class="route" aria-label="15-minute route"><span><b>2 min</b>Choose and read</span><span><b>3 min</b>Literal</span><span><b>3 min</b>Allegorical</span><span><b>3 min</b>Moral</span><span><b>2 min</b>Anagogical</span><span><b>2 min</b>Review and save</span></div>`;}
const art=`<svg class="heroart" viewBox="0 0 220 190" fill="none" aria-hidden="true"><circle cx="108" cy="93" r="83" fill="#f3e5e9"/><path d="M41 47c28-10 47-4 67 10 20-14 40-20 70-10v100c-27-8-49-3-70 11-21-14-43-19-67-11V47Z" fill="#fffefa" stroke="#722d45" stroke-width="3"/><path d="M108 57v100M57 72c11-3 26 0 39 7m-39 14c12-2 27 2 39 8m-39 14c12-2 25 1 39 8m24-44c13-7 28-9 42-7m-42 29c13-6 28-8 42-6m-42 28c13-6 28-8 42-6" stroke="#ba9b8c" stroke-width="2"/><circle cx="166" cy="129" r="23" fill="#722d45"/><path d="M166 115v28m-14-14h28" stroke="white" stroke-width="2.5"/></svg>`;
function chooseView(){return`<section class="hero"><div><p class="eyebrow">After Lesson 2.2 · Guided practice</p><h1>Four ways to read.<br>One passage at a time.</h1><p class="lead">Choose <strong>one</strong> assigned passage. Read it, then use the literal, allegorical, moral, and anagogical senses to explain what you find.</p><div class="pillrow"><span class="pill">15 minutes</span><span class="pill">10 fresh passages</span><span class="pill">One or two sentences per sense</span></div></div>${art}</section>${route()}<div class="callout"><p><strong>How to work:</strong> Your teacher may assign a passage or let you choose. Work alone or with a partner as directed. You will write four short responses for <em>one</em> passage, then review and download if asked. This practice is not automatically submitted or graded.</p></div><div class="sectionhead"><div><p class="eyebrow">Choose a passage</p><h2>Ten places to practise</h2></div><button data-action="import" class="small">Open a saved backup</button></div><div class="passagegrid">${PASSAGES.map((p,i)=>`<article class="panel passagecard"><span class="eyebrow">Option ${i+1} · ${esc(p.genre)}</span><h3>${esc(p.title)}</h3><span class="ref">${esc(p.ref)}</span><p>${esc(p.scene)}</p>${state.works[p.id]&&SENSES.some(s=>(state.works[p.id].answers?.[s.key]||'').trim())?'<span class="saved">Saved notes</span>':''}<button class="primary small" data-select="${p.id}">${state.selected===p.id?'Continue this passage':'Choose this passage'}</button></article>`).join('')}</div>`;}
function senseGuidance(p, key) {
  if (key === 'literal') {
    return `<div class="sense-guidance">
      <h3>Read and mark a detail</h3>
      <p>${link(reading(p.ref), p.ref + ' · NRSV Catholic Edition')}</p>
      <p>${esc(p.notice)} Pick one detail that helps explain the scene, poem, or vision as a whole.</p>
    </div>`;
  }
  const guidance = PASSAGE_GUIDANCE[p.id][key];
  return `<div class="sense-guidance">
    <h3>Work through the connection</h3>
    ${guidance.reference ? `<p>${link(reading(guidance.reference), 'Read ' + guidance.reference)}</p>` : ''}
    <ol>
      <li>${esc(guidance.find)}</li>
      <li>${esc(guidance.connect)}</li>
    </ol>
  </div>`;
}

function senseCard(s, w) {
  const p = passage(state.selected);
  const answer = w.answers[s.key] || '';
  const wordCount = answer.trim() ? answer.trim().split(/\s+/).length : 0;
  return `<section class="panel sense" id="sense-${s.key}">
    <header><p class="eyebrow">${esc(s.tag)}</p><span class="time">${esc(s.time)}</span></header>
    <h2>${esc(s.name)} sense</h2>
    <p class="question" id="question-${s.key}">${esc(s.question)}</p>
    ${senseGuidance(p, s.key)}
    <p class="why">${esc(s.why)}</p>
    <label for="answer-${s.key}">Your ${esc(s.name.toLowerCase())} response</label>
    <textarea id="answer-${s.key}" data-answer="${s.key}" aria-describedby="question-${s.key}" rows="3" maxlength="6000" placeholder="${esc(s.placeholder)}">${esc(answer)}</textarea>
    <p class="wordline"><span data-word="${s.key}">${wordCount}</span> words · brief notes are enough</p>
  </section>`;
}
function workView(){const p=passage(state.selected);if(!p)return chooseView();const w=work(p);return`<div class="workspacehead"><div><p class="eyebrow">Your passage · ${esc(p.genre)}</p><h1>${esc(p.title)}</h1><p class="lead">${esc(p.ref)} · Work through all four senses in order.</p></div><div class="toolbar"><button data-nav="choose" class="small">Switch passage</button><button data-action="backup" class="small">Save a backup</button></div></div><div class="workgrid"><div><section class="panel" style="margin-bottom:.9rem"><div class="formrow"><div><label for="names">Name(s) for your response file</label><input id="names" type="text" maxlength="150" value="${esc(state.names)}" placeholder="Enter your name, or both names if working with a partner"></div><span class="status" id="saveStatus"></span></div><div class="progress" role="progressbar" aria-label="Responses recorded" aria-valuemin="0" aria-valuemax="4" aria-valuenow="${count(w)}"><span id="progressFill" style="width:${count(w)*25}%"></span></div><p class="tiny muted" id="progressText" style="margin:0">${count(w)} of 4 responses recorded</p></section><div class="sense-list">${SENSES.map(s=>senseCard(s,w)).join('')}</div><section class="panel review"><p class="eyebrow">Final two minutes</p><h2>Check your four answers</h2><p class="tiny muted">Tick these when you have checked your work. You can download a draft at any time.</p><div class="checklist">${CHECKS.map(([key,label])=>`<label><input type="checkbox" data-check="${key}" ${w.checks[key]?'checked':''}><span>${esc(label)}</span></label>`).join('')}</div><div class="toolbar"><button class="primary" data-action="download">Download my responses</button><button data-action="print">Print / Save as PDF</button><button data-action="backup">Save a backup</button></div><p class="tiny muted" style="margin:.7rem 0 0">The text and print copies are for reading or submission; keep the .json backup if you need to edit on another device.</p></section></div><aside class="desk" aria-label="Reading and help"><section class="panel"><p class="eyebrow">Read first · 2 min</p><h3>${esc(p.title)}</h3><p class="ref">${esc(p.ref)}</p><p>${esc(p.scene)}</p><p><strong>Notice:</strong> ${esc(p.notice)}</p><div class="toolbar">${link(reading(p.ref),'Read NRSV Catholic Edition')}${link(notes(p),'USCCB context notes')}</div><p class="tiny muted" style="margin:.7rem 0 0">Use your class NRSV if a link is unavailable. USCCB notes use a different translation.</p></section><section class="panel"><h3>Need a careful connection?</h3><p>Start with this passage’s own meaning. Then, if helpful, compare ${link(reading(p.bridge),p.bridge)}. A cross-reference is a clue to test, not an answer to copy.</p><button data-nav="guide" class="small">Review the four senses</button></section><section class="panel"><h3>Your save</h3><p class="status" id="sideSave"></p><p class="tiny muted">Answers save in this browser. Use Save a backup before changing devices or clearing browser data.</p><button data-action="import" class="small">Open a backup</button></section></aside></div>`;}
function guideView(){return`<p class="eyebrow">A short reminder</p><h1>The four senses work together.</h1><p class="lead">The literal sense asks what the human author meant. The three spiritual senses build from that foundation. A thoughtful connection should fit the passage and the whole Christian story.</p><div class="guidegrid"><section class="panel"><h2>1. Literal</h2><p><span class="key">Ask:</span> What does the text say and mean in its own genre and setting?</p><p>Notice who speaks, what happens, and what kind of writing this is. A vision can use images without being a photograph.</p></section><section class="panel"><h2>2. Allegorical</h2><p><span class="key">Ask:</span> How can this point to Christ, the Church, or salvation?</p><p>Use a real detail and, where helpful, a related passage. Do not invent a secret meaning for every object.</p></section><section class="panel"><h2>3. Moral</h2><p><span class="key">Ask:</span> How should we live in response?</p><p>Give one specific action that follows from the passage. This is about life today.</p></section><section class="panel"><h2>4. Anagogical</h2><p><span class="key">Ask:</span> What final hope with God does it suggest?</p><p>Think about lasting communion with God, resurrection, or the fulfilment of God’s plan. This is about our ultimate destiny.</p></section><section class="panel wide"><h2>Sources and saving</h2><p>The method follows ${link('https://www.vatican.va/content/catechism/en/part_one/section_one/chapter_two/article_3/iii_the_holy_spirit,_interpreter_of_scripture.html','Catechism of the Catholic Church 109–119')}, especially 115–118. Passage links request the NRSV Catholic Edition; USCCB notes give context in the NABRE translation. Passage summaries and teacher prompts are paraphrases.</p><p>Your work stays in this browser. A backup .json file can restore editing on another device. A .txt response or printout cannot restore editing. No account, upload, or automatic submission is built into this activity.</p><div class="toolbar"><button class="primary" data-nav="${state.selected?'work':'choose'}">${state.selected?'Return to my passage':'Choose a passage'}</button><button data-action="backup">Save a backup</button><button data-action="import">Open a backup</button><button data-action="clear" class="quiet">Clear saved work</button></div></section></div>`;}
function teacherLock(){return`<section class="panel" style="max-width:560px;margin:2rem auto"><p class="eyebrow">Teacher reference</p><h1>Teacher guide</h1><p>Enter the teacher PIN to view facilitation notes and possible readings.</p><form id="teacherUnlockForm"><label for="teacherPin" style="font-weight:700">Teacher PIN</label><input id="teacherPin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required aria-describedby="teacherPinError" style="margin:.4rem 0"><p id="teacherPinError" role="alert" style="color:#a12d42"></p><div class="toolbar"><button class="primary" type="submit">Unlock guide</button><button data-nav="choose" type="button">Return to passages</button></div></form></section>`;}
function teacherNotes(p){if(!p)return'';const t=p.teacher;return`<p class="eyebrow">${esc(p.genre)} · ${esc(p.ref)}</p><h2>${esc(p.title)}</h2><p><strong>Literal:</strong> ${esc(t.literal)}</p><p><strong>Allegorical:</strong> ${esc(t.allegorical)}</p><p><strong>Moral:</strong> ${esc(t.moral)}</p><p><strong>Anagogical:</strong> ${esc(t.anagogical)}</p><div class="teachernote"><p><strong>Watch for:</strong> ${esc(t.caution)}</p></div><p class="tiny">${link(reading(p.ref),'Read passage')} · ${link(reading(p.bridge),'Possible connection: '+p.bridge)}</p>`;}
function teacherView(){const p=passage($('#teacherSelect')?.value)||passage(state.selected)||PASSAGES[0];return`<div class="workspacehead"><div><p class="eyebrow">Teacher reference · Formative practice</p><h1>Facilitate, then compare.</h1><p class="lead">Assign one passage per student or pair. The route totals 15 minutes; allow extra time for whole-class discussion.</p></div><button data-action="lock" class="small">Lock teacher guide</button></div><div class="guidegrid"><section class="panel"><h2>A 15-minute route</h2><ol><li>Choose and read: 2 min.</li><li>Literal: 3 min.</li><li>Allegorical: 3 min.</li><li>Moral: 3 min.</li><li>Anagogical: 2 min.</li><li>Review and save: 2 min.</li></ol><p class="tiny">One or two sentences per sense are enough. Ask each student or pair to name a verse detail before drawing a spiritual connection.</p></section><section class="panel"><h2>Debrief questions</h2><ol><li>Which detail anchored your literal reading?</li><li>How does your Christ connection fit the passage?</li><li>How is today’s moral action different from eternal hope?</li><li>Where is your reading tentative, and what would you check next?</li></ol><p class="tiny">The examples below are possible directions, not a single answer key. Do not grade personal religious assent.</p></section><section class="panel wide"><label for="teacherSelect" style="font-weight:700">Passage discussion notes</label><select id="teacherSelect" style="margin:.4rem 0 1rem">${PASSAGES.map(q=>`<option value="${q.id}" ${q.id===p.id?'selected':''}>${esc(q.title)} · ${esc(q.ref)}</option>`).join('')}</select><div id="teacherNotes">${teacherNotes(p)}</div></section></div>`;}
function render(focus=false){if(state.view==='work'&&!passage(state.selected))state.view='choose';const main=$('#main');main.innerHTML=state.view==='choose'?chooseView():state.view==='work'?workView():state.view==='guide'?guideView():teacherUnlocked?teacherView():teacherLock();for(const v of['choose','guide','teacher']){const n=$('#nav-'+v);if(state.view===v)n.setAttribute('aria-current','page');else n.removeAttribute('aria-current');}updateStatus();if(focus){window.scrollTo(0,0);main.focus({preventScroll:true});}}
function updateStatus(){const w=work();const n=count(w);const bar=$('#progressFill');if(bar){bar.style.width=n*25+'%';bar.parentElement.setAttribute('aria-valuenow',String(n));}if($('#progressText'))$('#progressText').textContent=n+' of 4 responses recorded';const message=storageOK?'Saved in this browser':'Browser saving unavailable. Download a backup.';for(const el of document.querySelectorAll('#saveStatus,#sideSave')){el.textContent=message;el.classList.toggle('error',!storageOK);}}
function downloadFile(name,contents,type){const blob=new Blob([contents],{type:type+';charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function backup(){save();downloadFile('four-senses-backup.json',JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2),'application/json');toast('Backup downloaded. Keep the .json file to continue editing elsewhere.');}
function responseText(){const p=passage(state.selected);if(!p)return'';const w=work(p);return['FOUR SENSES IN PRACTICE · HRE4M UNIT 2.2','Name(s): '+(state.names.trim()||'[Not supplied]'),'Passage: '+p.title+' · '+p.ref,'Reading: '+reading(p.ref),'','LITERAL',w.answers.literal?.trim()||'[Not recorded]','','ALLEGORICAL',w.answers.allegorical?.trim()||'[Not recorded]','','MORAL',w.answers.moral?.trim()||'[Not recorded]','','ANAGOGICAL',w.answers.anagogical?.trim()||'[Not recorded]','','SELF-CHECK',...CHECKS.map(([key,label])=>(w.checks[key]?'[x] ':'[ ] ')+label),'','This text copy cannot restore progress. Save a .json backup to keep editing.'].join('\n');}
function preparePrint(){const p=passage(state.selected);if(!p){$('#printSheet').innerHTML='<h1>Four Senses in Practice</h1><p>Choose a passage before printing.</p>';return;}const w=work(p);$('#printSheet').innerHTML=`<h1>Four Senses in Practice</h1><p class="meta">HRE4M Unit 2.2 · ${esc(p.title)} · ${esc(p.ref)}<br>Name(s): ${esc(state.names||'________________________')}<br>Reading: ${esc(reading(p.ref))}</p>${SENSES.map(s=>`<section class="answer"><h2>${esc(s.name)} sense</h2><p class="${w.answers[s.key]?.trim()?'':'blank'}">${esc(w.answers[s.key]?.trim()||'[Not recorded]')}</p></section>`).join('')}<h2>Self-check</h2>${CHECKS.map(([key,label])=>`<p>${w.checks[key]?'☑':'☐'} ${esc(label)}</p>`).join('')}<p class="meta">This print copy cannot restore editing. Keep a .json backup if needed.</p>`;}
document.addEventListener('click',e=>{const sel=e.target.closest('[data-select]');if(sel){select(sel.dataset.select);return;}const v=e.target.closest('[data-nav]');if(v){e.preventDefault();nav(v.dataset.nav);return;}const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;e.preventDefault();if(a==='lock'){teacherUnlocked=false;render(true);}else if(a==='backup')backup();else if(a==='import'){$('#importFile').value='';$('#importFile').click();}else if(a==='download'){if(!passage(state.selected))return;downloadFile('four-senses-'+state.selected+'.txt',responseText(),'text/plain');toast('Response text downloaded.');}else if(a==='print'){preparePrint();window.print();}else if(a==='clear'){if(confirm('Clear all saved names and notes in this browser? Download a backup first if you need them.')){state={appId:APP_ID,version:1,view:'choose',selected:'',names:'',works:{}};try{localStorage.removeItem(STORAGE_KEY);}catch(e){}render(true);toast('Saved work cleared.');}}});
document.addEventListener('input',e=>{if(e.target.id==='names'){state.names=e.target.value.slice(0,150);save();return;}const key=e.target.dataset.answer;if(key&&SENSES.some(s=>s.key===key)&&work()){work().answers[key]=e.target.value.slice(0,6000);save(true);const words=e.target.value.trim()?e.target.value.trim().split(/\s+/).length:0;const label=document.querySelector('[data-word="'+key+'"]');if(label)label.textContent=words;}});
document.addEventListener('change',e=>{if(e.target.dataset.check&&work()){work().checks[e.target.dataset.check]=e.target.checked;save();}if(e.target.id==='teacherSelect'&&teacherUnlocked){$('#teacherNotes').innerHTML=teacherNotes(passage(e.target.value));}});
document.addEventListener('submit',e=>{if(e.target.id!=='teacherUnlockForm')return;e.preventDefault();const pin=$('#teacherPin');if(pin.value==='1984'){teacherUnlocked=true;pin.value='';render(true);}else{pin.value='';$('#teacherPinError').textContent='Incorrect PIN. Try again.';pin.focus();}});
$('#importFile').addEventListener('change',async e=>{const file=e.target.files?.[0];if(!file)return;if(file.size>2000000){toast('That backup file is too large.');return;}try{const loaded=validate(JSON.parse(await file.text()));if(confirm('Open this backup? It will replace the notes saved in this browser.')){state=loaded;save();render(true);toast('Backup opened.');}}catch(err){toast(err.message||'Could not open this backup.');}});
window.addEventListener('beforeprint',preparePrint);
window.addEventListener('pagehide',()=>save());
render();
</script>
</body></html>
